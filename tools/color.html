<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RGB 颜色查询</title>
<link rel="icon" href="../assets/images/title.ico" type="image/x-icon">
<link rel="shortcut icon" type="image/x-icon" href="../assets/images/title.ico" media="screen"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #faf9f4;
  --cardBg: #ffffff;
  --textPrimary: rgba(22,23,28,0.88);
  --textSecondary: rgba(22,23,28,0.55);
  --accent: #ffd83d;
  --accentHover: #ffe066;
  --border: rgba(22,23,28,0.08);
  --fontFamily: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Microsoft YaHei', sans-serif;
  --maxWidth: 1200px;
}
html, body {
  background: var(--bg);
  color: var(--textPrimary);
  font-family: var(--fontFamily);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* 顶栏 */
.pp-topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(250,249,244,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.pp-topbar-inner {
  max-width: var(--maxWidth); margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 12px 24px;
}
.pp-logo {
  font-size: 20px; font-weight: 700;
  letter-spacing: -0.02em;
  display: flex; align-items: center; gap: 8px;
}
.pp-logo-dot {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.pp-topbar-links { display: flex; gap: 4px; }
.pp-topbar-links a {
  padding: 6px 12px; border-radius: 8px;
  font-size: 13px; color: var(--textSecondary); transition: all 0.15s;
}
.pp-topbar-links a:hover { color: var(--textPrimary); background: rgba(22,23,28,0.04); }

/* 主体 */
.cc-main { max-width: var(--maxWidth); margin: 0 auto; padding: 24px 24px 80px; }

/* 工具栏 */
.cc-toolbar {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  margin-bottom: 20px;
}
.cc-search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 400px; }
.cc-search {
  width: 100%; padding: 10px 14px 10px 36px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--cardBg);
  font-family: inherit; font-size: 14px;
  outline: none; transition: border-color 0.15s;
}
.cc-search:focus { border-color: var(--accent); }
.cc-search::placeholder { color: var(--textSecondary); }
.cc-search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  font-size: 14px; color: var(--textSecondary); pointer-events: none;
}
.cc-count { font-size: 13px; color: var(--textSecondary); }
.cc-sort-btn {
  padding: 8px 14px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--cardBg);
  font-size: 13px; color: var(--textPrimary); transition: all 0.15s;
}
.cc-sort-btn:hover { border-color: var(--accent); }
.cc-sort-btn.active { background: var(--accent); border-color: var(--accent); font-weight: 600; }

/* 颜色网格 */
.cc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}
.cc-card {
  background: var(--cardBg);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden; cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.cc-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
.cc-swatch {
  height: 80px; width: 100%;
  border-bottom: 1px solid var(--border);
}
.cc-info { padding: 10px 14px; }
.cc-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.cc-hex { font-size: 13px; color: var(--textSecondary); font-family: 'Consolas', monospace; }
.cc-rgb { font-size: 12px; color: var(--textSecondary); font-family: 'Consolas', monospace; margin-top: 2px; }
.cc-empty {
  grid-column: 1 / -1; text-align: center;
  padding: 60px 20px; color: var(--textSecondary);
}

/* 底部 */
.pp-footer {
  border-top: 1px solid var(--border);
  padding: 24px; text-align: center;
}
.pp-footer-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 12px; }
.pp-footer-links a {
  padding: 6px 12px; border-radius: 8px;
  font-size: 13px; color: var(--textSecondary); transition: all 0.15s;
}
.pp-footer-links a:hover { color: var(--textPrimary); background: rgba(22,23,28,0.04); }
.pp-footer-copy { font-size: 12px; color: var(--textSecondary); }

/* Toast */
.pp-toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: #333; color: #fff;
  padding: 12px 24px; border-radius: 12px;
  font-size: 14px; z-index: 1100;
  opacity: 0; transition: all 0.3s; pointer-events: none;
}
.pp-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 600px) {
  .pp-topbar-inner { padding: 10px 16px; }
  .pp-topbar-links { display: none; }
  .cc-main { padding: 16px 16px 60px; }
  .cc-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .cc-swatch { height: 60px; }
  .cc-info { padding: 8px 10px; }
  .cc-name { font-size: 13px; }
  .cc-hex, .cc-rgb { font-size: 11px; }
}
</style>
</head>
<body>

<div class="pp-topbar">
  <div class="pp-topbar-inner">
    <div class="pp-logo">
      <span class="pp-logo-dot">🎨</span>
      RGB 颜色查询
    </div>
    <nav class="pp-topbar-links">
      <a href="../index.html">主页</a>
      <a href="../nav.html">导航</a>
      <a href="../prompt.html">提示词</a>
      <a href="../words.html">学单词</a>
      <a href="../notes.html">文档</a>
    </nav>
  </div>
</div>

<div class="cc-main">
  <div class="cc-toolbar">
    <div class="cc-search-wrap">
      <span class="cc-search-icon">🔍</span>
      <input type="search" id="search" class="cc-search" placeholder="搜索颜色名 / hex / RGB（按 / 聚焦）" autocomplete="off">
    </div>
    <span class="cc-count" id="count">加载中…</span>
    <button class="cc-sort-btn active" id="sort-name" data-sort="name">按名称</button>
    <button class="cc-sort-btn" id="sort-hex" data-sort="hex">按色值</button>
  </div>
  <div class="cc-grid" id="grid"></div>
</div>

<div class="pp-footer">
  <div class="pp-footer-links">
    <a href="../index.html">主页</a>
    <a href="../nav.html">导航</a>
    <a href="../prompt.html">提示词混合器</a>
    <a href="../words.html">学单词</a>
    <a href="../notes.html">阅读文档</a>
  </div>
  <p class="pp-footer-copy">© 2011-2026 杜超群</p>
</div>

<div class="pp-toast" id="toast"></div>

<script>
var COLORS = [];
var SORT = 'name';

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() {
      showToast('已复制：' + text);
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已复制：' + text);
  }
}

function renderGrid() {
  var grid = document.getElementById('grid');
  var query = document.getElementById('search').value.trim().toLowerCase();
  var list = COLORS.slice();

  // 过滤
  if (query) {
    list = list.filter(function(c) {
      return c.name.toLowerCase().indexOf(query) >= 0 ||
             c.hex.toLowerCase().indexOf(query) >= 0 ||
             c.rgb.indexOf(query) >= 0;
    });
  }

  // 排序
  if (SORT === 'name') {
    list.sort(function(a, b) { return a.name.localeCompare(b.name); });
  } else if (SORT === 'hex') {
    list.sort(function(a, b) { return a.hex.localeCompare(b.hex); });
  }

  document.getElementById('count').textContent = list.length + ' / ' + COLORS.length + ' 种颜色';

  if (!list.length) {
    grid.innerHTML = '<div class="cc-empty">无匹配颜色</div>';
    return;
  }

  var html = list.map(function(c) {
    return '<div class="cc-card" data-hex="' + c.hex + '" data-rgb="' + c.rgb + '" data-name="' + c.name + '">' +
             '<div class="cc-swatch" style="background:#' + c.hex + '"></div>' +
             '<div class="cc-info">' +
               '<div class="cc-name">' + c.name + '</div>' +
               '<div class="cc-hex">#' + c.hex + '</div>' +
               '<div class="cc-rgb">RGB(' + c.rgb + ')</div>' +
             '</div>' +
           '</div>';
  }).join('');
  grid.innerHTML = html;

  // 点击复制
  grid.querySelectorAll('.cc-card').forEach(function(card) {
    card.addEventListener('click', function() {
      copyText('#' + this.dataset.hex);
    });
  });
}

function init() {
  var search = document.getElementById('search');
  search.addEventListener('input', renderGrid);
  search.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { this.value = ''; renderGrid(); }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === '/' && e.target.tagName !== 'INPUT') {
      e.preventDefault(); search.focus();
    }
  });

  // 排序按钮
  document.querySelectorAll('.cc-sort-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.cc-sort-btn').forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      SORT = this.dataset.sort;
      renderGrid();
    });
  });

  // 加载颜色数据
  fetch('../assets/data/colors.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      COLORS = data.colors || [];
      renderGrid();
    })
    .catch(function(err) {
      console.error(err);
      document.getElementById('grid').innerHTML =
        '<div class="cc-empty">颜色数据加载失败，请通过 HTTP 协议访问。</div>';
    });
}

init();
</script>

</body>
</html>
