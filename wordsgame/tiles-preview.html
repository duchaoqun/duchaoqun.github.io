<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>Tiles Preview 512x512</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #1a1a2e; color: #eee; padding: 30px; }
  h1 { font-size: 24px; margin-bottom: 5px; }
  .sub { color: #888; margin-bottom: 30px; }
  .tile-card { display: inline-block; margin: 15px; text-align: center; vertical-align: top; }
  .tile-card h3 { margin: 10px 0 5px; font-size: 16px; color: #f4c26b; }
  .tile-card code { color: #7ec8a2; font-size: 12px; }
  /* 512 的瓦片铺 4 份 = 2048x2048 预览 */
  .tile-preview {
    width: 400px; height: 400px;
    background-repeat: repeat;
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
    border-radius: 6px;
    border: 2px solid #444;
    margin: 0 auto;
  }
  .tree-bg { background: repeating-conic-gradient(#3a5a3a 0 25%, #4a6a4a 0 50%) 50% / 40px 40px; }
  .tree-wrap { position: relative; width: 400px; height: 400px; margin: 0 auto; border-radius: 6px; border: 2px solid #444; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,.4); }
  .tree-wrap img { width: 100%; height: 100%; object-fit: contain; }
  .size-bar { margin-top: 8px; font-size: 12px; color: #666; }
</style></head>
<body>
<h1>🎨 瓦片贴图素材预览</h1>
<p class="sub">512×512 · 无缝平铺验证 · 浏览器打开即可查看</p>

<div class="tile-card">
  <h3>🌿 grass</h3>
  <code>grass.png · 678KB</code>
  <div class="tile-preview" style="background-image: url('assets/tiles/grass.png'); background-size: 512px 512px;"></div>
  <div class="size-bar">512×512 × 4 tiles</div>
</div>

<div class="tile-card">
  <h3>🛤️ path</h3>
  <code>path.png · 627KB</code>
  <div class="tile-preview" style="background-image: url('assets/tiles/path.png'); background-size: 512px 512px;"></div>
</div>

<div class="tile-card">
  <h3>🏖️ sand</h3>
  <code>sand.png · 566KB</code>
  <div class="tile-preview" style="background-image: url('assets/tiles/sand.png'); background-size: 512px 512px;"></div>
</div>

<div class="tile-card">
  <h3>🌊 water</h3>
  <code>water.png · 426KB</code>
  <div class="tile-preview" style="background-image: url('assets/tiles/water.png'); background-size: 512px 512px;"></div>
</div>

<div class="tile-card">
  <h3>🪨 rock</h3>
  <code>rock.png · 641KB</code>
  <div class="tile-preview" style="background-image: url('assets/tiles/rock.png'); background-size: 512px 512px;"></div>
</div>

<div class="tile-card">
  <h3>🌳 tree (sprite)</h3>
  <code>tree.png · 136KB</code>
  <div class="tree-bg">
    <div class="tree-wrap">
      <img src="assets/tiles/tree.png" alt="tree">
    </div>
  </div>
</div>

</body></html>
