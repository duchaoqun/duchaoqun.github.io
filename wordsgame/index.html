  <!-- ============ 登录/注册页 ============ -->
  <section id="auth-view" class="view active">
    <div class="auth-card">
      <div class="auth-card-bg"></div>
      <div class="auth-card-overlay"></div>

      <div class="auth-card-content">
        <div class="auth-brand">
          <h1 class="auth-title">WordsGame</h1>
          <p class="auth-subtitle">词语世界 · 探索之旅</p>
        </div>

        <!-- 登录表单 -->
        <form id="login-form" class="auth-form active" autocomplete="off">
          <h2 class="form-title">登录</h2>
          <div class="form-group">
            <label>用户名 / 邮箱</label>
            <input type="text" name="account" placeholder="请输入用户名或邮箱" required="">
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" name="password" placeholder="请输入密码" required="">
          </div>
          <button type="submit" class="btn btn-primary">登录</button>
          <p class="form-switch">
            还没有账号？<a href="#" data-switch="register">立即注册</a>
          </p>
          <p class="form-msg" id="login-msg"></p>
        </form>

        <!-- 注册表单 -->
        <form id="register-form" class="auth-form" autocomplete="off">
          <h2 class="form-title">注册</h2>
          <div class="form-row">
            <div class="form-group">
              <label>用户名</label>
              <input type="text" name="username" placeholder="3-32 位字母/数字/下划线" required="">
            </div>
            <div class="form-group">
              <label>邮箱</label>
              <input type="email" name="email" placeholder="your@email.com" required="">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>密码</label>
              <input type="password" name="password" placeholder="至少 8 位" required="">
            </div>
            <div class="form-group">
              <label>确认密码</label>
              <input type="password" name="password2" placeholder="再输一次" required="">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>昵称</label>
              <input type="text" name="nickname" placeholder="显示给别人的名字（可选）">
            </div>
            <div class="form-group">
              <label>性别</label>
              <select name="gender">
                <option value="other">保密</option>
                <option value="male">男</option>
                <option value="female">女</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>头像</label>
            <div class="avatar-picker" id="avatar-picker"><div class="avatar-option selected" title="头像"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj4KICA8cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzhhNmQxZiIvPgogIDx0ZXh0IHg9IjUwIiB5PSI2NCIgZm9udC1zaXplPSI0OCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2ZmZiI+8J+RpDwvdGV4dD4KPC9zdmc+" alt="头像"></div><div class="avatar-option" title="头像2"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj4KICA8cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzJkNmE0ZiIvPgogIDx0ZXh0IHg9IjUwIiB5PSI2NCIgZm9udC1zaXplPSI0OCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2ZmZiI+8J+MsjwvdGV4dD4KPC9zdmc+" alt="头像2"></div><div class="avatar-option" title="头像3"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj4KICA8cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzFkMzU1NyIvPgogIDx0ZXh0IHg9IjUwIiB5PSI2NCIgZm9udC1zaXplPSI0OCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2ZmZiI+8J+MijwvdGV4dD4KPC9zdmc+" alt="头像3"></div><div class="avatar-option" title="头像4"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj4KICA8cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzcyMDliNyIvPgogIDx0ZXh0IHg9IjUwIiB5PSI2NCIgZm9udC1zaXplPSI0OCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2ZmZiI+8J+UrjwvdGV4dD4KPC9zdmc+" alt="头像4"></div><div class="avatar-option" title="头像5"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj4KICA8cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2U2Mzk0NiIvPgogIDx0ZXh0IHg9IjUwIiB5PSI2NCIgZm9udC1zaXplPSI0OCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2ZmZiI+8J+UpTwvdGV4dD4KPC9zdmc+" alt="头像5"></div><div class="avatar-option" title="头像6"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj4KICA8cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2Y0YTI2MSIvPgogIDx0ZXh0IHg9IjUwIiB5PSI2NCIgZm9udC1zaXplPSI0OCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2ZmZiI+4piA77iPPC90ZXh0Pgo8L3N2Zz4=" alt="头像6"></div></div>
          </div>
          <button type="submit" class="btn btn-primary">创建账号</button>
          <p class="form-switch">
            已有账号？<a href="#" data-switch="login">去登录</a>
          </p>
          <p class="form-msg" id="register-msg"></p>
        </form>
      </div>
    </div>
  </section>

  <!-- ============ 游戏主界面 ============ -->
  <section id="game-view" class="view">
    <canvas id="game-canvas"></canvas>

    <!-- 底部统一菜单栏 -->
    <footer class="bottom-bar">
      <!-- 左：玩家信息 -->
      <div class="bb-left">
        <div class="mini-avatar" id="mini-avatar"></div>
        <div class="mini-info">
          <span class="mini-nick" id="mini-nick">冒险者</span>
          <span class="mini-map" id="mini-map">新手村庄</span>
        </div>
      </div>

      <!-- 中：地图信息 -->
      <div class="bb-center">
        <div class="stat-item">
          <span class="stat-label">地图</span>
          <span class="stat-value" id="stat-map">新手村庄</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">坐标</span>
          <span class="stat-value" id="stat-pos">0, 0</span>
        </div>
        <div class="stat-item stat-money">
          <span class="stat-label">💰 金币</span>
          <span class="stat-value" id="stat-money">0元</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">背包</span>
          <span class="stat-value" id="stat-inv-count">0 件</span>
        </div>
      </div>

      <!-- 右：操作按钮 -->
      <div class="bb-right">
        <button class="bb-btn btn-inventory" id="btn-inventory">
          <span class="bb-btn-icon">🎒</span>
          <span class="bb-btn-label">背包</span>
        </button>
        <button class="bb-btn btn-logout" id="btn-logout" title="退出登录">
          <span class="bb-btn-icon">🚪</span>
          <span class="bb-btn-label">退出</span>
        </button>
      </div>
    </footer>

    <!-- 背包弹出层 -->
    <div class="modal-overlay" id="inventory-modal">
      <div class="modal-box inventory-box">
        <div class="modal-header">
          <h3>🎒 我的背包</h3>
          <button class="modal-close" data-close="inventory-modal">×</button>
        </div>
        <div class="modal-body">
          <div class="inventory-grid" id="inventory-grid">
            <!-- 物品格子由 JS 填充 -->
          </div>
          <p class="inventory-empty" id="inventory-empty" style="display:none;">
            背包空空如也，去探索世界收集物品吧！
          </p>
        </div>
      </div>
    </div>

    <!-- NPC 对话弹窗 -->
    <div class="modal-overlay" id="npc-modal">
      <div class="modal-box npc-box">
        <div class="modal-header">
          <h3 id="npc-title">NPC</h3>
          <button class="modal-close" data-close="npc-modal">×</button>
        </div>
        <div class="modal-body">
          <div class="npc-avatar" id="npc-avatar"></div>
          <p class="npc-dialog" id="npc-dialog">—</p>
          <div class="npc-menu" id="npc-menu"></div>
        </div>
      </div>
    </div>


    <!-- 商店弹窗 -->
    <div class="modal-overlay" id="shop-modal">
      <div class="modal-box shop-box">
        <div class="modal-header">
          <h3 id="shop-title">商店</h3>
          <div class="shop-money">💰 <span id="shop-money">0</span></div>
          <button class="modal-close" data-close="shop-modal">×</button>
        </div>
        <!-- Tab 切换 -->
        <div class="shop-tabs">
          <button class="shop-tab active" data-tab="buy">🛒 购买</button>
          <button class="shop-tab" data-tab="sell">💰 出售（60%）</button>
        </div>
        <div class="modal-body shop-body">
          <div class="shop-panel" id="shop-panel-buy">
            <div class="shop-list" id="shop-buy-list"></div>
          </div>
          <div class="shop-panel hidden" id="shop-panel-sell">
            <div class="shop-list" id="shop-sell-list"></div>
          </div>
        </div>
        <!-- 分页控件 -->
        <div class="shop-pager">
          <button class="pager-btn" id="shop-prev">‹ 上一页</button>
          <span class="pager-info"><span id="shop-page-info">1 / 1</span></span>
          <button class="pager-btn" id="shop-next">下一页 ›</button>
        </div>
      </div>
    </div>

    <!-- 互动物品弹窗 -->
    <div class="modal-overlay" id="world-item-modal">
      <div class="modal-box item-box">
        <div class="modal-header">
          <h3 id="wi-title">物品</h3>
          <button class="modal-close" data-close="world-item-modal">×</button>
        </div>
        <div class="modal-body">
          <div class="item-detail">
            <div class="item-icon-big" id="wi-icon">📦</div>
            <div class="item-meta">
              <p><span class="meta-label">种类</span><span class="meta-value" id="wi-kind">-</span></p>
              <p><span class="meta-label">稀有度</span><span class="meta-value rarity" id="wi-rarity">-</span></p>
              <p><span class="meta-label">数量</span><span class="meta-value" id="wi-qty">-</span></p>
              <p class="item-desc" id="wi-desc">—</p>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" id="btn-pickup">拾取进背包</button>
          <button class="btn btn-secondary" data-close="world-item-modal">关闭</button>
        </div>
      </div>
    </div>

    <!-- 传送门（下一关）提示条 -->
    <div id="portal-banner" class="portal-banner" style="display:none;">
      <span id="portal-text">前往小树林 →</span>
      <button class="btn btn-primary" id="btn-warp">前往</button>
    </div>

<!-- 物品详情面板 -->
    <div class="modal-overlay" id="item-modal">
      <div class="modal-box item-box">
        <div class="modal-header">
          <h3 id="item-name">物品</h3>
          <button class="modal-close" data-close="item-modal">×</button>
        </div>
        <div class="modal-body">
          <div class="item-detail">
            <div class="item-icon-big" id="item-icon-big">📦</div>
            <div class="item-meta">
              <p><span class="meta-label">种类</span><span class="meta-value" id="item-kind">-</span></p>
              <p><span class="meta-label">稀有度</span><span class="meta-value rarity" id="item-rarity">-</span></p>
              <p><span class="meta-label">数量</span><span class="meta-value" id="item-qty">-</span></p>
              <p><span class="meta-label">描述</span></p>
              <p class="item-desc" id="item-desc">—</p>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-danger" id="btn-destroy">销毁</button>
          <button class="btn btn-secondary" id="btn-close-item">关闭</button>
        </div>
      </div>
    </div>

    <!-- 全局 Toast -->
    <div id="toast" class="toast"></div>
  </section>

  <!-- ============ 脚本 ============ -->
  <script type="importmap">
  {
    "imports": {
      "three": "./js/three-bundle.js?v=91"

  <script type="module" src="js/api.js?v=91"></script>
  <script type="module" src="js/auth.js?v=91"></script>
  <script type="module" src="js/inventory.js?v=91"></script>
  <script type="module" src="js/main.js?v=91"></script>


</body></html>
