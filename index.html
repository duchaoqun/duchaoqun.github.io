<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>杜超群 - 个人主页</title>
  <link rel="icon" href="assets/images/title.ico" type="image/x-icon">
  <link rel="shortcut icon" type="image/x-icon" href="assets/images/title.ico" media="screen"/>
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    /* ========== 深海背景 ========== */
    body {
      background: linear-gradient(180deg,
        #021b2e 0%,
        #032a4a 20%,
        #04365e 40%,
        #054372 60%,
        #065088 80%,
        #075d9a 100%);
      position: relative;
    }

    /* 深海微光 */
    .caustic-light {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(64, 180, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 60%, rgba(32, 145, 220, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(100, 200, 255, 0.06) 0%, transparent 40%);
      pointer-events: none;
      z-index: 1;
      animation: caustic-shift 12s ease-in-out infinite alternate;
    }

    @keyframes caustic-shift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(30px, -20px); }
    }

    /* ========== 气泡效果（从下向上浮动） ========== */
    .bubble {
      position: absolute;
      bottom: -40px;
      background: radial-gradient(circle at 30% 30%,
        rgba(255, 255, 255, 0.6) 0%,
        rgba(180, 230, 255, 0.3) 40%,
        rgba(100, 200, 255, 0.1) 100%);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow:
        inset 0 0 8px rgba(255, 255, 255, 0.4),
        0 0 12px rgba(120, 220, 255, 0.3);
      animation: bubble-rise linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    /* 气泡内部高光 */
    .bubble::before {
      content: '';
      position: absolute;
      top: 15%;
      left: 20%;
      width: 30%;
      height: 30%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      filter: blur(1px);
    }

    @keyframes bubble-rise {
      0% {
        transform: translateY(0) translateX(0) scale(0.6);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
        transform: translateY(-5vh) translateX(calc(var(--drift, 0px) * 0.2)) scale(0.8);
      }
      50% {
        transform: translateY(-50vh) translateX(var(--drift, 0px)) scale(1);
      }
      80% {
        opacity: 0.6;
        transform: translateY(-85vh) translateX(calc(var(--drift, 0px) * -0.5)) scale(1.05);
      }
      100% {
        transform: translateY(-110vh) translateX(calc(var(--drift, 0px) * 0.8)) scale(1.1);
        opacity: 0;
      }
    }

    /* ========== 中间卡片容器 ========== */
    .main-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(900px, 92vw);
      height: min(560px, 85vh);
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 0 60px rgba(64, 180, 255, 0.15),
        0 25px 60px rgba(0, 0, 0, 0.5),
        inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      z-index: 5;
      background: rgba(10, 30, 55, 0.6);
    }

    /* 卡片背景层 - 图片 */
    .card-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-image: url('assets/photo/6.jpg');
      transition: opacity 0.8s ease;
      z-index: 0;
    }

    .card-bg.loading {
      opacity: 0;
    }

    /* 卡片半透明遮罩，确保内容可读性 */
    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg,
        rgba(5, 20, 40, 0.55) 0%,
        rgba(10, 30, 55, 0.35) 50%,
        rgba(5, 20, 40, 0.45) 100%);
      z-index: 1;
    }

    /* 卡片内容层 */
    .card-content {
      position: relative;
      z-index: 2;
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* ========== 左侧个人信息面板 ========== */
    .profile-panel {
      width: 320px;
      min-width: 280px;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
      background: linear-gradient(180deg,
        rgba(5, 25, 50, 0.55) 0%,
        rgba(5, 20, 45, 0.35) 100%);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* 头像 */
    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(120, 220, 255, 0.5);
      box-shadow:
        0 0 20px rgba(100, 200, 255, 0.3),
        0 8px 30px rgba(0, 0, 0, 0.4);
      background: linear-gradient(135deg, #1a3a5c, #0d2240);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      position: relative;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      animation: avatar-rotate 20s linear infinite;
    }

    /* 头像顺时针旋转，速度适中 */
    @keyframes avatar-rotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .avatar-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      color: rgba(180, 230, 255, 0.8);
      background: linear-gradient(135deg, #1a3a5c, #0d2240);
    }

    .avatar img.loaded + .avatar-fallback,
    .avatar img:not([src]),
    .avatar img[src=""] {
      display: none;
    }

    /* 姓名 */
    .profile-name {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      background: linear-gradient(90deg, #7fdfff, #b3e5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .profile-title {
      font-size: 13px;
      color: rgba(180, 220, 255, 0.7);
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    /* 座右铭 */
    .motto {
      width: 100%;
      padding: 16px 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(120, 200, 255, 0.2);
      border-radius: 12px;
      margin-bottom: 28px;
      text-align: center;
      position: relative;
    }

    .motto::before,
    .motto::after {
      content: '"';
      position: absolute;
      font-size: 32px;
      color: rgba(120, 220, 255, 0.4);
      font-family: Georgia, serif;
      line-height: 1;
    }

    .motto::before {
      top: 4px;
      left: 8px;
    }

    .motto::after {
      bottom: -4px;
      right: 8px;
    }

    .motto-text {
      font-size: 14px;
      line-height: 1.7;
      color: rgba(220, 240, 255, 0.9);
      font-style: italic;
    }

    /* 联系方式 */
    .contact-label {
      font-size: 12px;
      color: rgba(180, 220, 255, 0.6);
      letter-spacing: 2px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .contact-list {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .contact-item {
      position: relative;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(120, 200, 255, 0.25);
      transition: all 0.3s ease;
      color: #fff;
      font-size: 18px;
    }

    .contact-item:hover {
      transform: translateY(-4px);
      background: rgba(120, 220, 255, 0.2);
      border-color: rgba(120, 220, 255, 0.6);
      box-shadow: 0 8px 20px rgba(100, 200, 255, 0.3);
    }

    .contact-item .contact-name {
      position: absolute;
      bottom: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: rgba(180, 220, 255, 0.7);
      white-space: nowrap;
    }

    /* 二维码浮动弹窗 */
    .qr-popup {
      position: absolute;
      bottom: calc(100% + 14px);
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      width: 150px;
      padding: 12px;
      background: rgba(10, 25, 45, 0.95);
      border: 1px solid rgba(120, 220, 255, 0.3);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(100, 200, 255, 0.15);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 10;
    }

    .qr-popup::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 7px solid transparent;
      border-top-color: rgba(120, 220, 255, 0.3);
    }

    .contact-item:hover .qr-popup {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .qr-popup img {
      width: 100%;
      height: 120px;
      object-fit: contain;
      border-radius: 8px;
      background: #fff;
    }

    .qr-popup .qr-label {
      text-align: center;
      font-size: 12px;
      color: rgba(180, 220, 255, 0.9);
      margin-top: 8px;
    }

    .qr-popup .qr-fallback {
      width: 100%;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      color: #999;
      font-size: 12px;
    }

    /* 邮件弹窗（纯文字） */
    .qr-popup .qr-text {
      width: 100%;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      word-break: break-all;
    }

    .qr-popup .qr-text p {
      font-size: 13px;
      color: rgba(220, 240, 255, 0.95);
      line-height: 1.5;
    }

    /* ========== 右侧主内容区 ========== */
    .main-content {
      flex: 1;
      padding: 50px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
      overflow: hidden;
    }

    .greeting {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 16px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      background: linear-gradient(90deg, #fff, #b3e5ff, #7fdfff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sub-greeting {
      font-size: 16px;
      color: rgba(220, 240, 255, 0.85);
      line-height: 1.8;
      margin-bottom: 24px;
      max-width: 380px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }

    .deco-line {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(120, 220, 255, 0.8), transparent);
      margin-bottom: 24px;
    }

    .quote {
      font-size: 15px;
      color: rgba(200, 230, 255, 0.8);
      line-height: 1.9;
      max-width: 360px;
      font-style: italic;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .quote-mark {
      font-size: 40px;
      color: rgba(120, 220, 255, 0.5);
      line-height: 0;
      vertical-align: -10px;
      margin: 0 4px;
    }

    /* ========== 底部版权 ========== */
    .footer {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(180, 220, 255, 0.5);
      font-size: 12px;
      z-index: 10;
      letter-spacing: 1px;
    }

    /* 底部链接（小字，居中，在版权上方） */
    .footer-links {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 10px;
      max-width: 92vw;
      z-index: 10;
    }
    .footer-links a {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: rgba(22,23,28,0.55);
      background: rgba(255,255,255,0.5);
      border: 1px solid rgba(22,23,28,0.06);
      transition: all 0.15s;
      white-space: nowrap;
    }
    .footer-links a:hover {
      color: rgba(22,23,28,0.88);
      background: #ffd83d;
      border-color: #ffd83d;
    }
    .footer-links a.is-external::after {
      content: ' ↗';
      opacity: 0.6;
    }

    /* 点击激活态（移动端无 hover 时使用） */
    .contact-item.active .qr-popup {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    /* ========== 响应式 - 平板及以下 ========== */
    @media (max-width: 768px) {
      .main-card {
        width: 94vw;
        height: min(640px, 90vh);
        flex-direction: column;
      }

      /* 内容区可滚动，保持卡片圆角裁剪 */
      .card-content {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .profile-panel {
        width: 100%;
        min-width: unset;
        padding: 24px 20px 20px;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        flex-shrink: 0;
      }

      .avatar {
        width: 90px;
        height: 90px;
        margin-bottom: 10px;
      }

      .profile-name {
        font-size: 22px;
      }

      .motto {
        margin-bottom: 20px;
        padding: 12px 16px;
      }

      .main-content {
        padding: 24px 20px;
        flex: 1;
        min-height: 0;
      }

      .greeting {
        font-size: 26px;
      }

      .footer {
        font-size: 10px;
        bottom: 8px;
      }
    }

    /* ========== 响应式 - 手机竖屏 ========== */
    @media (max-width: 480px) {
      .main-card {
        width: 96vw;
        height: 94vh;
        border-radius: 16px;
      }

      .profile-panel {
        padding: 20px 16px 16px;
      }

      .avatar {
        width: 78px;
        height: 78px;
        border-width: 2px;
      }

      .profile-name {
        font-size: 20px;
        letter-spacing: 1px;
      }

      .profile-title {
        font-size: 12px;
        margin-bottom: 16px;
      }

      .motto {
        padding: 10px 14px;
        margin-bottom: 16px;
      }

      .motto-text {
        font-size: 13px;
      }

      .contact-label {
        margin-bottom: 10px;
      }

      .contact-item {
        width: 42px;
        height: 42px;
        font-size: 16px;
      }

      .main-content {
        padding: 20px 16px;
      }

      .greeting {
        font-size: 22px;
        margin-bottom: 12px;
      }

      .sub-greeting {
        font-size: 14px;
        margin-bottom: 18px;
      }

      .quote {
        font-size: 13px;
      }

      .quote-mark {
        font-size: 32px;
      }

      /* 二维码弹窗适配小屏 */
      .qr-popup {
        width: 130px;
        padding: 10px;
      }

      .qr-popup img,
      .qr-popup .qr-fallback {
        height: 100px;
      }

      .footer {
        font-size: 9px;
        bottom: 6px;
        padding: 0 10px;
        text-align: center;
      }
    }

    /* ========== 超小屏 ========== */
    @media (max-width: 360px) {
      .avatar {
        width: 66px;
        height: 66px;
      }

      .profile-name {
        font-size: 18px;
      }

      .contact-item {
        width: 38px;
        height: 38px;
        font-size: 15px;
      }

      .contact-list {
        gap: 10px;
      }

      .greeting {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- 深海背景光效 -->
  <div class="caustic-light"></div>

  <!-- 气泡容器 -->
  <div id="bubble-container"></div>

  <!-- 中间卡片 -->
  <div class="main-card">
    <!-- 卡片背景图 -->
    <div class="card-bg loading" id="cardBg"></div>
    <div class="card-overlay"></div>

    <!-- 卡片内容 -->
    <div class="card-content">
      <!-- 左侧个人信息面板 -->
      <aside class="profile-panel">
        <!-- 头像 -->
        <div class="avatar">
          <img id="avatarImg" src="assets/images/icon.jpg" alt="头像"

          <div class="avatar-fallback" id="avatarFallback" style="display:none;">
            <i class="fa fa-user"></i>
          </div>
        </div>

        <!-- 姓名 -->
        <h2 class="profile-name">杜超群</h2>
        <!-- <p class="profile-title">【简简单单，平平安安】</p> -->

        <!-- 座右铭 -->
        <div class="motto">
          <p class="motto-text">人生得意须尽欢<br>莫使金樽空对月</p>
        </div>

        <!-- 联系方式 -->
        <p class="contact-label">联系方式</p>
        <div class="contact-list">
          <!-- QQ -->
          <div class="contact-item" data-qr="qq">
            <i class="fab fa-qq" title="QQ"></i>
            <span class="contact-name">QQ</span>
            <div class="qr-popup">
              <img src="assets/images/qq.jpg" alt="QQ二维码"
                   onerror="this.outerHTML='<div class=&quot;qr-fallback&quot;>QQ二维码</div>'">
              <p class="qr-label">QQ: 848408012</p>
            </div>
          </div>

          <!-- 抖音 -->
          <div class="contact-item" data-qr="douyin">
            <i class="fab fa-tiktok" title="抖音"></i>
            <span class="contact-name">抖音</span>
            <div class="qr-popup">
              <img src="assets/images/douyin.jpg" alt="抖音二维码"
                   onerror="this.outerHTML='<div class=&quot;qr-fallback&quot;>抖音二维码</div>'">
              <p class="qr-label">抖音: chaoqun8484</p>
            </div>
          </div>

          <!-- 微信 -->
          <div class="contact-item" data-qr="wechat">
            <i class="fab fa-weixin" title="微信"></i>
            <span class="contact-name">微信</span>
            <div class="qr-popup">
              <img src="assets/images/wechat.jpg" alt="微信二维码"
                   onerror="this.outerHTML='<div class=&quot;qr-fallback&quot;>微信二维码</div>'">
              <p class="qr-label">微信: du_chao_qun</p>
            </div>
          </div>

          <!-- 邮件 -->
          <div class="contact-item" data-qr="email">
            <i class="fa fa-envelope" title="邮件"></i>
            <span class="contact-name">邮件</span>
            <div class="qr-popup">
              <div class="qr-text">
                <i class="fa fa-envelope" style="font-size:24px;color:#7fdfff;margin-bottom:8px;"></i>
                <p>du.chao.qun@163.com</p>
                <p class="qr-label">邮箱：网易邮箱</p>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- 右侧主内容 -->
      <main class="main-content">
        <h1 class="greeting">您好！</h1>
        <div class="deco-line"></div>
        <p class="sub-greeting">
          欢迎来到我的主页, 如有任何问题, 请随时联系我.<br>
        </p>
        <p class="quote">
          <span class="quote-mark">"</span>
          保持热爱,奔赴山海.
          <span class="quote-mark">"</span>
        </p>
      </main>
    </div>
  </div>

  <!-- 底部链接 -->
  <nav class="footer-links" id="footer-links"></nav>

  <!-- 底部版权 -->
  <footer class="footer">
    Copyright 2011-<span id="footer-year">2026</span> DuChaoQun Design · Made with ❤️
  </footer>

  <script>
    /* 气泡生成 - 从下向上浮动，带左右摆动 */
    const bubbleContainer = document.getElementById('bubble-container');
    function createBubble() {
      const bubble = document.createElement('div');
      // 气泡尺寸：3-18px，大小不一更自然
      const size = Math.random() * 15 + 3;
      const left = Math.random() * 100;
      const duration = Math.random() * 8 + 6;  // 6-14 秒
      const drift = (Math.random() * 60 - 30); // 左右漂移 -30~30px

      bubble.className = 'bubble';
      bubble.style.width = size + 'px';
      bubble.style.height = size + 'px';
      bubble.style.left = left + '%';
      bubble.style.animationDuration = duration + 's';
      // 透传漂移量给动画（配合 keyframes 中的 translateX）
      bubble.style.setProperty('--drift', drift + 'px');
      // 小气泡更透明，大气泡更明显
      bubble.style.opacity = size < 8 ? '0.5' : '0.85';

      bubbleContainer.appendChild(bubble);
      setTimeout(() => bubble.remove(), duration * 1000);
    }
    // 每 250ms 生成一个气泡，密度适中
    setInterval(createBubble, 250);

    /* 卡片背景图加载 */
    const cardBg = document.getElementById('cardBg');
    const bgImg = new Image();
    bgImg.onload = () => {
      cardBg.classList.remove('loading');
    };
    bgImg.onerror = () => {
      cardBg.classList.remove('loading');
    };
    bgImg.src = 'assets/photo/6.jpg';

    /* 移动端点击显示二维码（移动端无 hover） */
    const contactItems = document.querySelectorAll('.contact-item');
    contactItems.forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        // 关闭其他弹窗
        contactItems.forEach(other => {
          if (other !== item) other.classList.remove('active');
        });
        item.classList.toggle('active');
      });
    });
    // 点击页面其他位置关闭二维码弹窗
    document.addEventListener('click', () => {
      contactItems.forEach(item => item.classList.remove('active'));
    });

    /* 底部快捷链接（小字，链接到各子页面） */
    const FOOTER_LINKS = [
      { name: '我的导航', url: 'nav.html' },
      { name: '我的笔记', url: 'notes.html' },
      { name: '提示词器', url: 'prompt.html' },
      { name: '英语词图', url: 'english.html' },
      { name: '学习单词', url: 'words.html' },
      { name: 'Obsidian 词云', url: 'obsidian.html' },
      { name: '我的世界', url: 'hello.html' },
      { name: '2048', url: 'pages/2048.html' },
      { name: '俄罗斯方块', url: 'pages/Tetris.html' },
      { name: 'RGB 颜色', url: 'tools/color.html' },
      { name: '条形码', url: 'tools/barcode.html' },
      { name: '关系图谱', url: 'tools/cytoscape.html' },
      { name: '手写签名',     url: 'tools/signature-generator.html' }
    ];
    const footerLinks = document.getElementById('footer-links');
    footerLinks.innerHTML = FOOTER_LINKS.map(item =>
      '<a href="' + item.url + '">' + item.name + '</a>'
    ).join('');

    /* 版权年份动态生成 */
    document.getElementById('footer-year').textContent = new Date().getFullYear();
  </script>
</body>
