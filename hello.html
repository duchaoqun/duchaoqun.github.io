<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开放世界 - Hello</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Consolas', 'Microsoft YaHei', monospace;
            user-select: none;
        }

        #gameCanvas {
            position: fixed;
            inset: 0;
            display: block;
        }

        /* ========== HUD ========== */
        #hud {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        /* 准星 */
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 18px; height: 18px;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.25s;
        }

        #crosshair.hidden { opacity: 0; }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #ffffff;
            box-shadow: 0 0 8px #88ccff, 0 0 16px #4488ff;
            border-radius: 1px;
        }

        #crosshair::before {
            top: 50%; left: 0;
            width: 100%; height: 2px;
            transform: translateY(-50%);
        }

        #crosshair::after {
            left: 50%; top: 0;
            width: 2px; height: 100%;
            transform: translateX(-50%);
        }

        #crosshair .center-dot {
            position: absolute;
            top: 50%; left: 50%;
            width: 4px; height: 4px;
            background: #88ccff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 6px #88ccff, 0 0 12px #4488ff, 0 0 20px #2266ff;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.8); }
        }

        /* 交互提示 */
        #interactHint {
            position: absolute;
            top: calc(50% + 40px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 13px;
            color: #fff;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.15s;
        }

        #interactHint.show { opacity: 1; }
        #interactHint kbd {
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
            padding: 1px 6px;
            margin-right: 4px;
            font-family: inherit;
            font-size: 12px;
        }

        /* 交互菜单 */
        #contextMenu {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 20, 0.95);
            border: 1px solid rgba(100, 150, 255, 0.4);
            border-radius: 12px;
            padding: 16px 20px;
            min-width: 200px;
            pointer-events: auto;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(100, 150, 255, 0.15);
        }

        #contextMenu.show {
            opacity: 1;
            visibility: visible;
        }

        #contextMenu .target-title {
            font-size: 14px;
            color: #88ccff;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(100, 150, 255, 0.2);
            text-align: center;
        }

        #contextMenu .menu-item {
            display: block;
            width: 100%;
            background: none;
            border: none;
            color: #ddd;
            font-family: inherit;
            font-size: 14px;
            padding: 10px 14px;
            margin: 3px 0;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s;
        }

        #contextMenu .menu-item:hover {
            background: rgba(100, 150, 255, 0.15);
            color: #fff;
        }

        #contextMenu .menu-item.danger:hover {
            background: rgba(255, 100, 100, 0.15);
            color: #ffaaaa;
        }

        #contextMenu .close-menu {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.1);
            background: none;
            border: none;
            color: #888;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        #contextMenu .close-menu:hover { color: #ccc; }

        /* 开始覆盖层 */
        #startOverlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a1a 0%, #050510 100%);
            color: #fff;
        }

        #startOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s, visibility 0.4s;
            pointer-events: none;
        }

        #startOverlay h1 {
            font-size: 42px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #88ccff, #cc88ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #startOverlay .desc {
            font-size: 14px;
            color: #8888aa;
            margin-bottom: 32px;
            text-align: center;
        }

        #startOverlay .controls {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 24px 32px;
            margin-bottom: 32px;
        }

        #startOverlay .controls-row {
            display: flex;
            justify-content: space-between;
            gap: 40px;
            margin: 8px 0;
            font-size: 13px;
            color: #aaaacc;
        }

        #startOverlay .controls-row kbd {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            padding: 2px 8px;
            font-family: inherit;
            font-size: 12px;
            color: #fff;
            min-width: 28px;
            display: inline-block;
            text-align: center;
        }

        #startBtn {
            background: linear-gradient(135deg, #4466aa, #6644aa);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 48px;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(80, 100, 200, 0.4);
        }

        #startBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(80, 100, 200, 0.55);
        }

        #startBtn:active { transform: translateY(0); }

        /* ESC 提示 */
        #escHint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            opacity: 0;
            transition: opacity 0.5s;
        }

        #escHint.show { opacity: 1; }

        /* 蓄力条 */
        #chargeWrap {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.15s;
        }
        #chargeBar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #66dd66, #ffcc33, #ff4444);
            transition: width 0.05s linear;
        }

        /* 加载提示 */
        #loading {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #666;
            font-size: 14px;
            flex-direction: column;
            gap: 16px;
        }

        #loading .spinner {
            width: 40px; height: 40px;
            border: 3px solid #222;
            border-top-color: #4466aa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- 图片上传 -->
    <input type="file" id="photoUpload" accept="image/*" style="display:none">

    <!-- 加载 -->
    <div id="loading">
        <div class="spinner"></div>
        <div>正在加载世界...</div>
    </div>

    <!-- 开始覆盖层 -->
    <div id="startOverlay">
        <h1>开放世界</h1>
        <p class="desc">点击下方按钮进入游戏（需要锁定鼠标）</p>
        <div class="controls">
            <div class="controls-row"><span>移动</span><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span></div>
            <div class="controls-row"><span>跳跃</span><span><kbd>Space</kbd></span></div>
            <div class="controls-row"><span>视角</span><span>鼠标</span></div>
            <div class="controls-row"><span>蓄力射箭</span><span>按住<kbd>左键</kbd>松开发射</span></div>
            <div class="controls-row"><span>交互菜单</span><span><kbd>E</kbd></span></div>
            <div class="controls-row"><span>上传照片墙</span><span><kbd>P</kbd></span></div>
            <div class="controls-row"><span>隐藏/显示准星</span><span><kbd>右键</kbd></span></div>
            <div class="controls-row"><span>解锁鼠标</span><span><kbd>Esc</kbd></span></div>
        </div>
        <button id="startBtn">▶ 开始游戏</button>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div id="crosshair">
            <div class="center-dot"></div>
        </div>
        <div id="interactHint"></div>
        <div id="escHint">按 Esc 解锁鼠标</div>
        <div id="chargeWrap">
            <div id="chargeBar"></div>
        </div>
    </div>

    <!-- 交互菜单 -->
    <div id="contextMenu">
        <div class="target-title" id="menuTitle">目标</div>
        <div id="menuItems"></div>
        <button class="close-menu" id="closeMenu">关闭 (ESC)</button>
    </div>

    <script type="module">
        import * as THREE from './assets/js/three.module.js';

        /* ============================================================
         * 游戏全局变量
         * ============================================================ */
        var canvas = document.getElementById('gameCanvas');
        var renderer, scene, camera, raycaster;
        var COLLIDABLE_MESHES = [];  // 可碰撞网格（AABB）
        var INTERACTIVE_MESHES = []; // 可交互网格（射线拾取）

        // 玩家状态
        var player = {
            position: new THREE.Vector3(0, 1.7, 0),
            velocity: new THREE.Vector3(),
            height: 1.7,
            radius: 0.35,
            speed: 5.5,
            jumpForce: 8.0,
            gravity: 22.0,
            onGround: true,  // 出生时就在地面上
        };

        // 视角（用欧拉角手动控制，避免依赖 PointerLockControls.js）
        var yaw = 0, pitch = 0;

        // 输入状态
        var keys = {};
        var isPointerLocked = false;
        var crosshairVisible = true;
        var gameStarted = false;  // 是否已进入游戏（自由模式或PointerLock模式）

        // 射线拾取
        var highlightMesh = null;
        var interactTarget = null;

        // 弓箭系统
        var bow = null;              // 第一人称弓模型
        var bowString = null;        // 弓弦（可拉伸）
        var nockedArrow = null;      // 搭在弦上的箭（视觉）
        var arrows = [];             // 飞行中/已插入的箭
        var isCharging = false;
        var chargeStart = 0;
        var maxChargeTime = 1.2;     // 蓄力到最大值的时间（秒）
        var minArrowSpeed = 12;
        var maxArrowSpeed = 55;
        var arrowGravity = 14;
        var arrowRaycaster = new THREE.Raycaster();
        var photoWall = null;        // 照片墙网格

        // 自由模式视角更新（Q/E 转向，上下方向键俯仰）
        function updateFreeLook() {
            if (!gameStarted || isPointerLocked) return;
            if (keys['KeyQ']) yaw -= 0.03;
            if (keys['KeyE']) yaw += 0.03;
            if (keys['ArrowUp']) pitch = Math.max(pitch - 0.02, -Math.PI/2 + 0.05);
            if (keys['ArrowDown']) pitch = Math.min(pitch + 0.02, Math.PI/2 - 0.05);
        }

        /* ============================================================
         * 初始化
         * ============================================================ */
        function init() {
            // 1. 渲染器
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x050515, 1);

            // 2. 场景
            scene = new THREE.Scene();

            // 3. 相机（放在玩家"眼睛"位置）
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 300);
            camera.position.copy(player.position);

            // 4. 射线拾取
            raycaster = new THREE.Raycaster();
            raycaster.far = 8;

            // 5. 加载场景
            // 从 URL 参数读取场景名，默认 scene_default（放在 assets/data/scene_xxx.json）
            var sceneName = new URLSearchParams(window.location.search).get('scene') || 'default';
            var sceneUrl = './assets/data/scene_' + sceneName + '.json';
            console.log('加载场景:', sceneUrl);
            loadScene(sceneUrl).then(function(success) {
                document.getElementById('loading').style.display = 'none';
                if (!success) {
                    document.getElementById('loading').innerHTML = '<div style="color:#f66">加载场景失败，请检查控制台</div>';
                }
            });

            // 创建第一人称弓
            createBow();

            // 6. 绑定事件
            bindEvents();

            // 7. 渲染循环
            requestAnimationFrame(loop);
        }

        /* ============================================================
         * 场景加载
         * ============================================================ */
        async function loadScene(url) {
            try {
                var res = await fetch(url);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                var data = await res.json();

                // 玩家参数
                if (data.player) {
                    var p = data.player;
                    player.position.set(p.position[0], p.position[1], p.position[2]);
                    if (p.height) player.height = p.height;
                    if (p.radius) player.radius = p.radius;
                    if (p.speed) player.speed = p.speed;
                    if (p.jumpForce) player.jumpForce = p.jumpForce;
                    if (p.gravity) player.gravity = p.gravity;
                    camera.position.copy(player.position);
                }

                // 雾（蓝天白云的白天色调）
                scene.fog = new THREE.Fog(0xcfe6f5, 30, 140);

                // 光照
                setupLighting(data.lighting);

                // 天空渐变背景（蓝天）
                var skyGeo = new THREE.SphereGeometry(300, 32, 32);
                var skyMat = new THREE.ShaderMaterial({
                    side: THREE.BackSide,
                    uniforms: {
                        topColor: { value: new THREE.Color('#2a7dd1') },
                        bottomColor: { value: new THREE.Color('#bfe3ff') },
                    },
                    vertexShader: `
                        varying vec3 vWorldPos;
                        void main() {
                            vec4 worldPos = modelMatrix * vec4(position, 1.0);
                            vWorldPos = worldPos.xyz;
                            gl_Position = projectionMatrix * viewMatrix * worldPos;
                        }
                    `,
                    fragmentShader: `
                        uniform vec3 topColor;
                        uniform vec3 bottomColor;
                        varying vec3 vWorldPos;
                        void main() {
                            float h = normalize(vWorldPos).y;
                            gl_FragColor = vec4(mix(bottomColor, topColor, max(h, 0.0)), 1.0);
                        }
                    `,
                });
                var sky = new THREE.Mesh(skyGeo, skyMat);
                scene.add(sky);

                // 物体
                if (data.objects) {
                    data.objects.forEach(function(obj) {
                        var mesh = createMesh(obj);
                        if (mesh) scene.add(mesh);
                    });
                }

                // 白云粒子
                addClouds();

                // 构建缓存碰撞盒（整个游戏过程不变）
                rebuildCollidableBoxes();

                return true;
            } catch (err) {
                console.error('加载场景失败:', err);
                // 失败时用一个空场景兜底
                scene.fog = new THREE.Fog(0x1a1a2e, 10, 50);
                var groundGeo = new THREE.BoxGeometry(20, 1, 20);
                var groundMat = new THREE.MeshStandardMaterial({ color: 0x2d5a3d, roughness: 0.9 });
                var ground = new THREE.Mesh(groundGeo, groundMat);
                ground.position.set(0, -0.5, 0);
                scene.add(ground);
                COLLIDABLE_MESHES.push(ground);
                rebuildCollidableBoxes();
                return false;
            }
        }

        function setupLighting(l) {
            if (!l) return;
            if (l.ambient) {
                scene.add(new THREE.AmbientLight(new THREE.Color(l.ambient.color), l.ambient.intensity));
            }
            if (l.directional) {
                var dl = new THREE.DirectionalLight(new THREE.Color(l.directional.color), l.directional.intensity);
                dl.position.set(l.directional.position[0], l.directional.position[1], l.directional.position[2]);
                scene.add(dl);
            }
            if (l.hemi) {
                scene.add(new THREE.HemisphereLight(
                    new THREE.Color(l.hemi.skyColor),
                    new THREE.Color(l.hemi.groundColor),
                    l.hemi.intensity
                ));
            }
        }

        function createMesh(obj) {
            var geo, mesh;
            var matProps = {
                color: new THREE.Color(obj.color || '#888888'),
                roughness: 0.85,
                metalness: 0.0,
            };
            if (obj.emissive) {
                matProps.emissive = new THREE.Color(obj.emissive);
                matProps.emissiveIntensity = 0.6;
            }
            var material = new THREE.MeshStandardMaterial(matProps);

            switch (obj.type) {
                case 'box':
                    geo = new THREE.BoxGeometry(obj.size[0], obj.size[1], obj.size[2]);
                    mesh = new THREE.Mesh(geo, material);
                    break;
                case 'sphere':
                    geo = new THREE.SphereGeometry(obj.radius, 16, 12);
                    mesh = new THREE.Mesh(geo, material);
                    break;
                case 'cylinder':
                    geo = new THREE.CylinderGeometry(
                        obj.radiusTop || 0.5,
                        obj.radiusBottom || 0.5,
                        obj.height || 1,
                        12
                    );
                    mesh = new THREE.Mesh(geo, material);
                    break;
                case 'cone':
                    geo = new THREE.ConeGeometry(obj.radius || 0.5, obj.height || 1, 12);
                    mesh = new THREE.Mesh(geo, material);
                    break;
                case 'group':
                    // 组合体：递归创建 children，放进一个 Group
                    mesh = new THREE.Group();
                    if (obj.children) {
                        obj.children.forEach(function(child) {
                            var childMesh = createMesh(child);
                            if (childMesh) mesh.add(childMesh);
                        });
                    }
                    break;
                default:
                    console.warn('未知类型:', obj.type);
                    return null;
            }

            mesh.position.set(obj.position[0], obj.position[1], obj.position[2]);
            mesh.userData = {
                id: obj.id,
                name: obj.name || obj.id || obj.type,
                collidable: obj.collidable !== false,
                interactive: obj.interactive === true,
                actions: obj.actions || [],
            };

            // Group 没有自己的 geometry，碰撞和交互交给子 mesh 处理
            if (mesh.isGroup) {
                if (mesh.userData.interactive) {
                    mesh.children.forEach(function(c) { INTERACTIVE_MESHES.push(c); });
                }
            } else {
                if (mesh.userData.collidable) COLLIDABLE_MESHES.push(mesh);
                if (mesh.userData.interactive) INTERACTIVE_MESHES.push(mesh);
            }

            return mesh;
        }

        function addClouds() {
            // 生成一张柔和的云纹理
            var c = document.createElement('canvas');
            c.width = 128; c.height = 128;
            var ctx = c.getContext('2d');
            var grd = ctx.createRadialGradient(64, 64, 2, 64, 64, 64);
            grd.addColorStop(0, 'rgba(255,255,255,1)');
            grd.addColorStop(0.4, 'rgba(255,255,255,0.75)');
            grd.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, 128, 128);
            var cloudTex = new THREE.CanvasTexture(c);
            cloudTex.colorSpace = THREE.SRGBColorSpace;

            var cloudMat = new THREE.SpriteMaterial({
                map: cloudTex,
                transparent: true,
                opacity: 0.9,
                depthWrite: false,
                color: 0xffffff,
            });

            var count = 60;
            for (var i = 0; i < count; i++) {
                var sprite = new THREE.Sprite(cloudMat.clone());
                var angle = Math.random() * Math.PI * 2;
                var dist = 60 + Math.random() * 180;
                sprite.position.set(
                    Math.cos(angle) * dist,
                    25 + Math.random() * 60,
                    Math.sin(angle) * dist
                );
                var scale = 18 + Math.random() * 30;
                sprite.scale.set(scale * (0.8 + Math.random() * 0.6), scale * (0.5 + Math.random() * 0.4), 1);
                sprite.userData.drift = 0.2 + Math.random() * 0.6;
                sprite.userData.baseAngle = angle;
                sprite.userData.dist = dist;
                scene.add(sprite);
            }
        }

        function updateClouds(dt) {
            scene.children.forEach(function(obj) {
                if (obj.isSprite && obj.userData.drift) {
                    obj.userData.baseAngle += obj.userData.drift * dt * 0.02;
                    var a = obj.userData.baseAngle;
                    var d = obj.userData.dist;
                    obj.position.x = Math.cos(a) * d;
                    obj.position.z = Math.sin(a) * d;
                }
            });
        }

        /* ============================================================
         * 弓（第一人称视角模型）
         * ============================================================ */
        function createBow() {
            var group = new THREE.Group();

            // 弓身：半圆环
            var bowRadius = 0.32;
            var bowGeo = new THREE.TorusGeometry(bowRadius, 0.018, 8, 24, Math.PI);
            // 默认端点在 ±X、弧凸向 +Y。旋转几何：端点 → ±Y，凸向 → -Z（前方）
            bowGeo.rotateZ(Math.PI / 2);
            bowGeo.rotateY(-Math.PI / 2);
            var bowMat = new THREE.MeshStandardMaterial({ color: 0x6b3a1a, roughness: 0.7, metalness: 0.1 });
            var bowBody = new THREE.Mesh(bowGeo, bowMat);
            group.add(bowBody);

            // 弓弦：细圆柱沿 Y 轴连接两端点 (0, ±bowRadius, 0)
            var stringMat = new THREE.MeshBasicMaterial({ color: 0xeeeeee });
            var stringGeo = new THREE.CylinderGeometry(0.004, 0.004, bowRadius * 2, 6);
            bowString = new THREE.Mesh(stringGeo, stringMat);
            bowString.position.set(0, 0, 0);
            // 默认弓弦在 z=0，蓄力时向 +Z（后方/射手方向）拉
            group.add(bowString);

            // 搭箭（视觉）：箭头尖端朝相机前方（-Z），故绕 Y 旋转 180°
            nockedArrow = createArrowMesh();
            nockedArrow.visible = true;
            nockedArrow.position.set(0, 0, 0);
            nockedArrow.rotation.y = Math.PI;
            group.add(nockedArrow);

            // 整体放到相机右下角
            group.position.set(0.3, -0.28, -0.55);
            group.rotation.y = -0.1;
            camera.add(group);
            scene.add(camera); // 确保相机在场景图中
            bow = group;
        }

        /* ============================================================
         * 箭矢
         * ============================================================ */
        // 箭的"前方"统一为局部 +Z（箭头尖端）
        var ARROW_FORWARD = new THREE.Vector3(0, 0, 1);

        function createArrowMesh() {
            var g = new THREE.Group();

            // 箭杆（沿 Z 轴）
            var shaft = new THREE.Mesh(
                new THREE.CylinderGeometry(0.012, 0.012, 0.7, 8),
                new THREE.MeshStandardMaterial({ color: 0xc9a35a, roughness: 0.8 })
            );
            shaft.rotation.x = Math.PI / 2; // Y 轴圆柱转成沿 Z
            g.add(shaft);

            // 箭头（尖端朝 +Z）
            var tip = new THREE.Mesh(
                new THREE.ConeGeometry(0.03, 0.12, 10),
                new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.8, roughness: 0.3 })
            );
            tip.rotation.x = Math.PI / 2; // 尖端朝 +Z
            tip.position.z = 0.41;
            g.add(tip);

            // 箭羽（两片交叉，在尾部 -Z）
            var fletchMat = new THREE.MeshStandardMaterial({ color: 0xcc3333, side: THREE.DoubleSide, roughness: 0.7 });
            var f1 = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.13, 0.07), fletchMat);
            f1.position.z = -0.3;
            g.add(f1);
            var f2 = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.02, 0.07), fletchMat);
            f2.position.z = -0.3;
            g.add(f2);

            return g;
        }

        function shootArrow(charge) {
            var arrow = createArrowMesh();
            arrow.userData = { velocity: new THREE.Vector3(), stuck: false, life: 0 };

            // 从相机位置沿视角方向发射
            var dir = new THREE.Vector3();
            camera.getWorldDirection(dir);

            // 起始位置：相机前方一点，避免卡在身上
            var start = camera.position.clone().add(dir.clone().multiplyScalar(0.6));
            arrow.position.copy(start);
            // 让箭的局部 +Z（箭头）对齐飞行方向
            arrow.quaternion.setFromUnitVectors(ARROW_FORWARD, dir);

            var speed = minArrowSpeed + (maxArrowSpeed - minArrowSpeed) * charge;
            arrow.userData.velocity.copy(dir).multiplyScalar(speed);

            scene.add(arrow);
            arrows.push(arrow);
        }

        function updateArrows(dt) {
            for (var i = arrows.length - 1; i >= 0; i--) {
                var a = arrows[i];
                if (a.userData.stuck) continue;

                a.userData.life += dt;
                var vel = a.userData.velocity;
                // 重力
                vel.y -= arrowGravity * dt;

                var moveLen = vel.length() * dt;
                if (moveLen < 1e-6) continue;
                var dir = vel.clone().normalize();

                // 扫掠碰撞：从当前位置向 dir 发射 moveLen 距离
                arrowRaycaster.set(a.position, dir);
                arrowRaycaster.far = moveLen;
                var hits = arrowRaycaster.intersectObjects(COLLIDABLE_MESHES, false);

                if (hits.length > 0) {
                    var hit = hits[0];
                    // 插入：让箭尖（局部 +Z 约 0.47）嵌入命中点
                    a.position.copy(hit.point).add(dir.clone().multiplyScalar(-0.4));
                    a.quaternion.setFromUnitVectors(ARROW_FORWARD, dir);
                    a.userData.stuck = true;
                    a.userData.velocity.set(0, 0, 0);
                } else {
                    a.position.add(dir.clone().multiplyScalar(moveLen));
                    a.quaternion.setFromUnitVectors(ARROW_FORWARD, dir);
                }

                // 超时移除（飞出世界）
                if (a.userData.life > 8 || a.position.y < -40) {
                    scene.remove(a);
                    arrows.splice(i, 1);
                }
            }
        }

        /* ============================================================
         * 蓄力 & 弓弦动画
         * ============================================================ */
        function getCharge() {
            if (!isCharging) return 0;
            var t = (performance.now() - chargeStart) / 1000;
            return Math.min(t / maxChargeTime, 1);
        }

        function updateBow(now) {
            if (!bow) return;
            var c = getCharge();
            // 弓弦向后拉（+Z 方向，相对弓的局部）
            if (bowString) {
                bowString.position.z = c * 0.12;
            }
            // 搭箭随之后移
            if (nockedArrow) {
                nockedArrow.position.z = c * 0.12;
            }
            // 蓄力时弓略微变色提示
            bow.children[0].material.emissive = new THREE.Color(0x442200).multiplyScalar(c);

            // 蓄力进度条
            var bar = document.getElementById('chargeBar');
            if (bar) {
                bar.style.width = (c * 100) + '%';
                bar.parentElement.style.opacity = isCharging ? '1' : '0';
            }
        }

        /* ============================================================
         * 照片墙（上传图片）
         * ============================================================ */
        function createPhotoWall(texture) {
            if (photoWall) {
                // 替换已有照片墙的纹理
                photoWall.material[4].map = texture;
                photoWall.material[4].needsUpdate = true;
                return;
            }
            var w = 5, h = 3.2, d = 0.15;
            var geo = new THREE.BoxGeometry(w, h, d);
            // 6 个面：[右,左,上,下,前,后]
            var wood = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.85 });
            var front = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.7 });
            var materials = [wood, wood, wood, wood, front, wood];
            photoWall = new THREE.Mesh(geo, materials);
            // 放在玩家前方（-Z 方向），面朝玩家（+Z 面为前）
            photoWall.position.set(0, h / 2 + 0.1, -12);
            photoWall.userData = {
                id: 'photoWall',
                name: '照片墙',
                collidable: true,
                interactive: true,
                actions: ['查看', '更换照片', '破坏'],
            };
            scene.add(photoWall);
            COLLIDABLE_MESHES.push(photoWall);
            INTERACTIVE_MESHES.push(photoWall);
            rebuildCollidableBoxes();
        }

        /* ============================================================
         * 事件绑定
         * ============================================================ */
        function bindEvents() {
            // 开始按钮 → Pointer Lock
            document.getElementById('startBtn').addEventListener('click', function() {
                canvas.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', function() {
                isPointerLocked = document.pointerLockElement === canvas;
                gameStarted = isPointerLocked;
                document.getElementById('startOverlay').classList.toggle('hidden', isPointerLocked);
                document.getElementById('escHint').classList.toggle('show', isPointerLocked);
                if (!isPointerLocked) closeContextMenu();
            });

            // 键盘
            document.addEventListener('keydown', function(e) {
                keys[e.code] = true;
                if (e.code === 'Escape') closeContextMenu();
                // 在开始覆盖层按 V 进入自由模式（无需 PointerLock）
                if (!gameStarted && document.getElementById('startOverlay').classList.contains('hidden') === false) {
                    if (e.code === 'KeyV') {
                        document.getElementById('startOverlay').classList.add('hidden');
                        gameStarted = true;
                    }
                }
                // E 键：交互（打开交互菜单）
                if (e.code === 'KeyE' && gameStarted && isPointerLocked) {
                    var menu = document.getElementById('contextMenu');
                    if (menu.classList.contains('show')) {
                        closeContextMenu();
                    } else {
                        handleLeftClick();
                    }
                }
                // P 键：上传图片作为照片墙
                if (e.code === 'KeyP') {
                    document.getElementById('photoUpload').click();
                }
            });
            document.addEventListener('keyup', function(e) { keys[e.code] = false; });

            // 鼠标视角（Pointer Lock 模式）
            document.addEventListener('mousemove', function(e) {
                if (!isPointerLocked) return;
                yaw -= e.movementX * 0.0022;
                pitch -= e.movementY * 0.0022;
                var lim = Math.PI / 2 - 0.01;
                if (pitch > lim) pitch = lim;
                if (pitch < -lim) pitch = -lim;
            });

            // 鼠标按钮
            canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            canvas.addEventListener('mousedown', function(e) {
                // 右键始终切换准星（即使未锁定也允许）
                if (e.button === 2) {
                    crosshairVisible = !crosshairVisible;
                    document.getElementById('crosshair').classList.toggle('hidden', !crosshairVisible);
                    return;
                }
                if (!isPointerLocked) return;
                if (e.button === 0) {
                    // 左键：蓄力射箭（若菜单打开则关闭菜单）
                    var menu = document.getElementById('contextMenu');
                    if (menu.classList.contains('show')) {
                        closeContextMenu();
                        return;
                    }
                    isCharging = true;
                    chargeStart = performance.now();
                }
            });
            canvas.addEventListener('mouseup', function(e) {
                if (e.button !== 0) return;
                if (!isCharging) return;
                var c = getCharge();
                isCharging = false;
                // 极短按也射出最低速箭
                shootArrow(Math.max(c, 0.05));
            });

            // 窗口缩放
            window.addEventListener('resize', function() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        /* ============================================================
         * 左键拾取 + 交互菜单
         * ============================================================ */
        function getLookTarget() {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            var hits = raycaster.intersectObjects(INTERACTIVE_MESHES, false);
            return hits.length > 0 ? hits[0].object : null;
        }

        function handleLeftClick() {
            // 如果菜单已打开，关闭
            var menu = document.getElementById('contextMenu');
            if (menu.classList.contains('show')) {
                closeContextMenu();
                return;
            }

            var target = getLookTarget();
            if (target) openContextMenu(target);
        }

        function openContextMenu(mesh) {
            var ud = mesh.userData;
            document.getElementById('menuTitle').textContent = ud.name + (ud.id ? ' (' + ud.id + ')' : '');

            var itemsDiv = document.getElementById('menuItems');
            itemsDiv.innerHTML = '';

            if (ud.actions && ud.actions.length > 0) {
                ud.actions.forEach(function(action) {
                    var btn = document.createElement('button');
                    btn.className = 'menu-item';
                    if (action === '破坏' || action === '关闭') btn.classList.add('danger');
                    btn.textContent = action;
                    btn.addEventListener('click', function() {
                        console.log('[' + ud.name + '] 执行动作:', action);
                        if (action === '破坏' || action === '关闭') {
                            scene.remove(mesh);
                            var ci = COLLIDABLE_MESHES.indexOf(mesh);
                            if (ci >= 0) COLLIDABLE_MESHES.splice(ci, 1);
                            var ii = INTERACTIVE_MESHES.indexOf(mesh);
                            if (ii >= 0) INTERACTIVE_MESHES.splice(ii, 1);
                            if (mesh === photoWall) photoWall = null;
                            rebuildCollidableBoxes();
                        } else if (action === '更换照片') {
                            closeContextMenu();
                            document.getElementById('photoUpload').click();
                            return;
                        }
                        closeContextMenu();
                    });
                    itemsDiv.appendChild(btn);
                });
            } else {
                var noAction = document.createElement('div');
                noAction.style.cssText = 'color:#888;font-size:13px;text-align:center;padding:8px;';
                noAction.textContent = '没有可交互的动作';
                itemsDiv.appendChild(noAction);
            }

            // 取消 Pointer Lock 以便点击菜单
            document.exitPointerLock();
            document.getElementById('contextMenu').classList.add('show');
            isPointerLocked = false;
        }

        function closeContextMenu() {
            document.getElementById('contextMenu').classList.remove('show');
        }

        document.getElementById('closeMenu').addEventListener('click', closeContextMenu);

        /* ============================================================
         * 物理 - 简化 AABB 碰撞
         * 核心思路：先算候选新位置，再检测每个轴是否碰撞，贴到面上
         * ============================================================ */

        // 缓存网格的世界 AABB（避免每帧 applyMatrix4）
        var COLLIDABLE_BOXES = [];

        function rebuildCollidableBoxes() {
            // 强制让 three.js 更新所有 mesh 的 matrixWorld（因为 mesh 创建后未 render 过）
            scene.updateMatrixWorld(true);
            COLLIDABLE_BOXES = [];
            for (var i = 0; i < COLLIDABLE_MESHES.length; i++) {
                var m = COLLIDABLE_MESHES[i];
                if (!m.geometry.boundingBox) m.geometry.computeBoundingBox();
                var b = m.geometry.boundingBox.clone();
                b.applyMatrix4(m.matrixWorld);
                COLLIDABLE_BOXES.push(b);
            }
            // 调试输出
            console.log('碰撞盒重建完成，共 ' + COLLIDABLE_BOXES.length + ' 个');
        }

        function aabbIntersect(a, b) {
            return a.min.x <= b.max.x && a.max.x >= b.min.x &&
                   a.min.y <= b.max.y && a.max.y >= b.min.y &&
                   a.min.z <= b.max.z && a.max.z >= b.min.z;
        }

        // 玩家 AABB（脚在 pos.y - player.height，头在 pos.y，中心在 pos.x, pos.z）
        function playerBox(pos) {
            return {
                minX: pos.x - player.radius, maxX: pos.x + player.radius,
                minY: pos.y - player.height, maxY: pos.y,
                minZ: pos.z - player.radius, maxZ: pos.z + player.radius,
            };
        }

        function boxIntersectPlayer(mBox, pBox) {
            return pBox.minX <= mBox.max.x && pBox.maxX >= mBox.min.x &&
                   pBox.minY <= mBox.max.y && pBox.maxY >= mBox.min.y &&
                   pBox.minZ <= mBox.max.z && pBox.maxZ >= mBox.min.z;
        }

        /* ============================================================
         * 更新逻辑 - 完全重写，保证方向+物理正确
         * ============================================================ */
        function update(dt) {
            if (!gameStarted) return;

            // --- 视角 ---
            camera.rotation.order = 'YXZ';
            camera.rotation.set(pitch, yaw, 0);

            // --- 方向向量（严格匹配 three.js 相机 rotation.set(pitch, yaw, 0)）---
            // three.js 相机默认朝 -Z。绕 Y 轴旋转 yaw 时，forward 用绕 Y 旋转矩阵：
            //   cos(yaw)*0 + sin(yaw)*(-1) = -sin(yaw)
            // 所以 forward = (-sin(yaw), 0, -cos(yaw))
            var sinY = Math.sin(yaw), cosY = Math.cos(yaw);
            var forwardX = -sinY, forwardZ = -cosY;
            // right = forward × up = (cos(yaw), 0, -sin(yaw))
            var rightX = cosY, rightZ = -sinY;

            // --- 输入 → 移动方向 ---
            var mx = 0, mz = 0;
            if (keys['KeyW'] || keys['ArrowUp'])    { mx += forwardX; mz += forwardZ; }
            if (keys['KeyS'] || keys['ArrowDown'])  { mx -= forwardX; mz -= forwardZ; }
            if (keys['KeyD'] || keys['ArrowRight']) { mx += rightX;   mz += rightZ; }
            if (keys['KeyA'] || keys['ArrowLeft'])  { mx -= rightX;   mz -= rightZ; }

            var len = Math.sqrt(mx * mx + mz * mz);
            if (len > 1e-6) { mx /= len; mz /= len; }

            // --- 速度 ---
            var desiredVX = mx * player.speed;
            var desiredVZ = mz * player.speed;

            // 重力 / 跳跃
            if (player.onGround) {
                // 在地面上：清除上一帧残留的垂直速度
                player.velocity.y = 0;
                if (keys['Space']) {
                    player.velocity.y = player.jumpForce;
                    player.onGround = false;
                }
            } else {
                // 在空中：持续施加重力
                player.velocity.y -= player.gravity * dt;
            }

            // --- 碰撞解算 ---
            var nx = player.position.x + desiredVX * dt;
            var nz = player.position.z + desiredVZ * dt;
            var ny = player.position.y + player.velocity.y * dt;

            // === 先做"站地探测"：用当前位置（未移动）检查脚下是否有地面 ===
            player.onGround = false;
            var FOOT_OFFSET = 0.05;  // 脚离地容差
            var currentFootY = player.position.y - player.height;
            for (var f = 0; f < COLLIDABLE_BOXES.length; f++) {
                var fb = COLLIDABLE_BOXES[f];
                // 检查玩家水平范围是否覆盖这个碰撞盒
                if (player.position.x + player.radius >= fb.min.x && player.position.x - player.radius <= fb.max.x &&
                    player.position.z + player.radius >= fb.min.z && player.position.z - player.radius <= fb.max.z) {
                    // 脚下方很近有地面顶面
                    if (currentFootY >= fb.max.y - FOOT_OFFSET && currentFootY <= fb.max.y + FOOT_OFFSET) {
                        player.onGround = true;
                        break;
                    }
                }
            }

            // X 轴
            var pBoxX = playerBox(new THREE.Vector3(nx, player.position.y, player.position.z));
            var footY = player.position.y - player.height;
            for (var i = 0; i < COLLIDABLE_BOXES.length; i++) {
                var mb = COLLIDABLE_BOXES[i];
                // 跳过地板：如果这个盒子的顶面就在玩家脚附近，它是地板，不应阻挡水平移动
                var isFloor = (mb.max.y <= footY + 0.1 && mb.max.y >= footY - 0.2);
                if (isFloor) continue;
                if (boxIntersectPlayer(mb, pBoxX)) {
                    if (desiredVX > 0) {
                        nx = mb.min.x - player.radius - 0.001;
                    } else if (desiredVX < 0) {
                        nx = mb.max.x + player.radius + 0.001;
                    }
                    desiredVX = 0;
                    break;
                }
            }

            // Z 轴
            var pBoxZ = playerBox(new THREE.Vector3(nx, player.position.y, nz));
            for (var j = 0; j < COLLIDABLE_BOXES.length; j++) {
                var mb2 = COLLIDABLE_BOXES[j];
                var isFloor2 = (mb2.max.y <= footY + 0.1 && mb2.max.y >= footY - 0.2);
                if (isFloor2) continue;
                if (boxIntersectPlayer(mb2, pBoxZ)) {
                    if (desiredVZ > 0) {
                        nz = mb2.min.z - player.radius - 0.001;
                    } else if (desiredVZ < 0) {
                        nz = mb2.max.z + player.radius + 0.001;
                    }
                    desiredVZ = 0;
                    break;
                }
            }

            // Y 轴（跳/落）- 只处理"方向合理"的盒子
            // 下落 → 只处理玩家**下方**的盒子（地面）
            // 上升 → 只处理玩家**上方**的盒子（天花板）
            var pBoxY = playerBox(new THREE.Vector3(nx, ny, nz));
            player.onGround = false;
            var feetTargetY = ny - player.height;
            var headTargetY = ny;
            for (var k = 0; k < COLLIDABLE_BOXES.length; k++) {
                var mb3 = COLLIDABLE_BOXES[k];
                if (!boxIntersectPlayer(mb3, pBoxY)) continue;

                if (player.velocity.y <= 0) {
                    // 下落：盒子必须在脚下附近（顶面在脚下方 0.5m 内）
                    if (mb3.max.y > feetTargetY + 0.5) continue; // 太高了，不是地面
                    ny = mb3.max.y + player.height + 0.001;
                    player.velocity.y = 0;
                    player.onGround = true;
                    break;
                } else {
                    // 上升：盒子必须在头顶附近（底面在头上 0.5m 内）
                    if (mb3.min.y < headTargetY - 0.5) continue; // 太低了，不是天花板
                    ny = mb3.min.y - 0.001;
                    player.velocity.y = 0;
                    break;
                }
            }

            // 边界保护：掉出世界就重置
            if (ny < -30) {
                nx = 0; ny = 1.7; nz = 0;
                player.velocity.set(0, 0, 0);
            }

            // 最终写入
            player.position.set(nx, ny, nz);
            player.velocity.x = desiredVX;
            player.velocity.z = desiredVZ;

            // 相机跟随
            camera.position.copy(player.position);

            // 射线拾取高亮
            updateHighlight();
        }

        function updateHighlight() {
            var target = crosshairVisible ? getLookTarget() : null;

            if (highlightMesh && highlightMesh !== target) {
                highlightMesh.material.emissive.setHex(0x000000);
                highlightMesh.material.emissiveIntensity = 0;
                highlightMesh = null;
            }

            if (target && target !== highlightMesh) {
                highlightMesh = target;
                target.material.emissive.setHex(0x4466aa);
                target.material.emissiveIntensity = 0.5;
            }

            // 交互提示
            var hint = document.getElementById('interactHint');
            if (target) {
                hint.innerHTML = '<kbd>E</kbd> ' + target.userData.name;
                hint.classList.add('show');
            } else {
                hint.classList.remove('show');
            }
        }

        /* ============================================================
         * 渲染循环
         * ============================================================ */
        var lastTime = performance.now();
        function loop(now) {
            var dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            update(dt);
            updateArrows(dt);
            updateBow(now);
            updateClouds(dt);
            renderer.render(scene, camera);

            requestAnimationFrame(loop);
        }

        // 照片墙：上传图片
        document.getElementById('photoUpload').addEventListener('change', function(e) {
            var file = e.target.files && e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(ev) {
                var img = new Image();
                img.onload = function() {
                    var tex = new THREE.Texture(img);
                    tex.colorSpace = THREE.SRGBColorSpace;
                    tex.needsUpdate = true;
                    createPhotoWall(tex);
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
            // 允许重复选择同一文件
            e.target.value = '';
        });

        // 启动
        try {
            init();
        } catch (err) {
            console.error('游戏初始化失败:', err);
            document.getElementById('loading').innerHTML =
                '<div style="color:#f66">初始化失败: ' + err.message + '</div>';
        }
    </script>
</body>
</html>
