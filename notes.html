<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杜超群 - 阅读文档</title>
<link rel="icon" href="assets/images/title.ico" type="image/x-icon">
<link rel="shortcut icon" type="image/x-icon" href="assets/images/title.ico" media="screen"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #faf9f4;
  --cardBg: #ffffff;
  --textPrimary: rgba(22,23,28,0.88);
  --textSecondary: rgba(22,23,28,0.55);
  --accent: #ffd83d;
  --accentHover: #ffe066;
  --border: rgba(22,23,28,0.08);
  --fontFamily: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Microsoft YaHei', sans-serif;
  --maxWidth: 1280px;
}
html, body {
  background: var(--bg);
  color: var(--textPrimary);
  font-family: var(--fontFamily);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* 顶栏 */
.pp-topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(250,249,244,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.pp-topbar-inner {
  max-width: var(--maxWidth); margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 12px 24px;
}
.pp-logo {
  font-size: 20px; font-weight: 700;
  letter-spacing: -0.02em;
  display: flex; align-items: center; gap: 8px;
}
.pp-logo-dot {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}

/* 搜索框 */
.ww-search-wrap { position: relative; }
.ww-search {
  width: 240px; padding: 8px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--cardBg);
  font-family: inherit; font-size: 14px;
  outline: none; transition: border-color 0.15s, width 0.15s;
}
.ww-search:focus { border-color: var(--accent); width: 300px; }
.ww-search::placeholder { color: var(--textSecondary); }
.ww-search-results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: var(--cardBg);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  max-height: 360px; overflow-y: auto;
  display: none; z-index: 200;
}
.ww-search-results.show { display: block; }
.ww-search-item {
  display: block; width: 100%; text-align: left;
  padding: 10px 14px; cursor: pointer;
  transition: background 0.12s;
  border-bottom: 1px solid var(--border);
}
.ww-search-item:last-child { border-bottom: none; }
.ww-search-item:hover { background: var(--accent); }
.ww-search-item-name { font-size: 14px; font-weight: 600; color: var(--textPrimary); }
.ww-search-item-summary { font-size: 12px; color: var(--textSecondary); margin-top: 2px; }
.ww-search-empty { padding: 10px 14px; font-size: 13px; color: var(--textSecondary); }

/* 主体布局 */
.ww-main {
  max-width: var(--maxWidth); margin: 0 auto;
  padding: 24px 24px 80px;
}
.ww-layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 24px;
  align-items: start;
}

/* 左侧目录 */
.ww-toc {
  position: sticky; top: 80px;
  background: var(--cardBg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
}
.ww-toc-title {
  font-size: 13px; font-weight: 600;
  color: var(--textSecondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 12px; padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.ww-toc-ch { margin-bottom: 10px; }
.ww-toc-ch-title {
  font-size: 14px; font-weight: 600;
  padding: 6px 8px; border-radius: 8px;
  cursor: pointer; transition: background 0.12s;
}
.ww-toc-ch-title:hover { background: rgba(22,23,28,0.04); }
.ww-toc-sec { margin: 4px 0 4px 12px; }
.ww-toc-sec-title {
  font-size: 13px; font-weight: 500;
  padding: 4px 8px; border-radius: 6px;
  cursor: pointer; color: var(--textSecondary);
  transition: all 0.12s;
}
.ww-toc-sec-title:hover { background: rgba(22,23,28,0.04); color: var(--textPrimary); }
.ww-toc-sub { margin: 2px 0 2px 24px; }
.ww-toc-sub-title {
  font-size: 12px; font-weight: 400;
  padding: 3px 8px; border-radius: 6px;
  cursor: pointer; color: var(--textSecondary);
  transition: all 0.12s;
}
.ww-toc-sub-title:hover { color: var(--textPrimary); }
.ww-toc-sub-title.active {
  background: var(--accent); color: #333; font-weight: 600;
}
.ww-toc-empty { font-size: 13px; color: var(--textSecondary); padding: 8px; }

/* 右侧内容 */
.ww-content {
  background: var(--cardBg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px 40px;
  min-height: 600px;
}
.ww-doc-header { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 2px solid var(--accent); }
.ww-doc-title { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
.ww-doc-meta { margin-top: 8px; font-size: 13px; color: var(--textSecondary); display: flex; gap: 16px; flex-wrap: wrap; }
.ww-doc-summary { margin-top: 12px; font-size: 15px; color: var(--textSecondary); line-height: 1.7; }

/* 章节标题 */
.ww-ch-title {
  font-size: 22px; font-weight: 700;
  margin: 32px 0 16px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  scroll-margin-top: 80px;
}
.ww-ch-title:first-child { margin-top: 0; }
.ww-sec-title {
  font-size: 18px; font-weight: 600;
  margin: 24px 0 12px; scroll-margin-top: 80px;
}
.ww-sub-title {
  font-size: 16px; font-weight: 600;
  margin: 18px 0 10px; scroll-margin-top: 80px;
  color: var(--textPrimary);
}

/* 段落与块 */
.ww-block { margin: 10px 0; }
.ww-paragraph { font-size: 15px; line-height: 1.8; color: var(--textPrimary); }
.ww-paragraph code {
  background: rgba(255,216,61,0.25); padding: 1px 6px; border-radius: 4px;
  font-size: 13px; font-family: 'Consolas','Monaco',monospace;
}
.ww-paragraph a { color: #c89500; text-decoration: underline; }

/* 图片 */
.ww-image { margin: 16px 0; text-align: center; }
.ww-image img { max-width: 100%; border-radius: 12px; border: 1px solid var(--border); }
.ww-image figcaption { margin-top: 8px; font-size: 13px; color: var(--textSecondary); }

/* 代码块 */
.ww-code {
  margin: 14px 0; border-radius: 12px;
  overflow: hidden; border: 1px solid var(--border);
  background: #1e1e2e;
}
.ww-code-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 14px; background: rgba(255,255,255,0.06);
  font-size: 12px; color: rgba(255,255,255,0.5);
  font-family: 'Consolas', monospace;
}
.ww-code-copy {
  padding: 2px 8px; border-radius: 6px; font-size: 11px;
  color: rgba(255,255,255,0.6); transition: all 0.15s;
}
.ww-code-copy:hover { background: rgba(255,255,255,0.1); color: #fff; }
.ww-code pre {
  padding: 14px 18px; margin: 0;
  overflow-x: auto; font-family: 'Consolas','Monaco','Courier New',monospace;
  font-size: 13px; line-height: 1.6; color: #e0e0e0;
}

/* 列表 */
.ww-list { margin: 10px 0; padding-left: 24px; }
.ww-list ol { list-style: decimal; }
.ww-list ul { list-style: disc; }
.ww-list li { font-size: 15px; line-height: 1.8; margin: 4px 0; }

/* 引用 */
.ww-quote {
  margin: 14px 0; padding: 12px 18px;
  border-left: 4px solid var(--accent);
  background: rgba(255,216,61,0.08);
  border-radius: 0 8px 8px 0;
}
.ww-quote-text { font-size: 15px; line-height: 1.7; font-style: italic; }
.ww-quote cite { display: block; margin-top: 6px; font-size: 13px; color: var(--textSecondary); }

/* 表格 */
.ww-table { margin: 14px 0; overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
.ww-table table { width: 100%; border-collapse: collapse; }
.ww-table th { background: rgba(22,23,28,0.04); padding: 10px 14px; text-align: left; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--border); }
.ww-table td { padding: 10px 14px; font-size: 14px; border-bottom: 1px solid var(--border); }
.ww-table tr:last-child td { border-bottom: none; }

/* 分割线 */
.ww-divider { margin: 20px 0; border: none; border-top: 1px solid var(--border); }

/* 提示框 */
.ww-note { margin: 14px 0; padding: 12px 16px; border-radius: 10px; font-size: 14px; line-height: 1.7; display: flex; gap: 10px; }
.ww-note-icon { flex-shrink: 0; font-size: 16px; }
.ww-note.info { background: rgba(100,180,255,0.1); border: 1px solid rgba(100,180,255,0.3); }
.ww-note.tip { background: rgba(100,220,120,0.1); border: 1px solid rgba(100,220,120,0.3); }
.ww-note.warn { background: rgba(255,180,80,0.12); border: 1px solid rgba(255,180,80,0.35); }

/* 空状态 */
.ww-placeholder { text-align: center; padding: 80px 20px; color: var(--textSecondary); }
.ww-placeholder h3 { font-size: 18px; margin-bottom: 8px; }

/* 底部 */
.pp-footer {
  border-top: 1px solid var(--border);
  padding: 24px; text-align: center;
}
.pp-footer-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 12px; }
.pp-footer-links a {
  padding: 6px 12px; border-radius: 8px;
  font-size: 13px; color: var(--textSecondary); transition: all 0.15s;
}
.pp-footer-links a:hover { color: var(--textPrimary); background: rgba(22,23,28,0.04); }
.pp-footer-copy { font-size: 12px; color: var(--textSecondary); }

/* Toast */
.pp-toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: #333; color: #fff;
  padding: 12px 24px; border-radius: 12px;
  font-size: 14px; z-index: 1100;
  opacity: 0; transition: all 0.3s; pointer-events: none;
}
.pp-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 响应式 */
@media (max-width: 900px) {
  .ww-layout { grid-template-columns: 1fr; }
  .ww-toc { position: relative; top: 0; max-height: none; order: 2; }
  .ww-content { order: 1; padding: 20px; }
}
@media (max-width: 600px) {
  .pp-topbar-inner { padding: 10px 16px; }
  .ww-search { width: 160px; }
  .ww-search:focus { width: 200px; }
  .ww-main { padding: 16px 16px 60px; }
}
</style>
</head>
<body>

<div class="pp-topbar">
  <div class="pp-topbar-inner">
    <div class="pp-logo">
      <span class="pp-logo-dot">📖</span>
      阅读文档
    </div>
    <div class="ww-search-wrap">
      <input type="search" id="search" class="ww-search" placeholder="搜索文档…" autocomplete="off">
      <div class="ww-search-results" id="search-results"></div>
    </div>
  </div>
</div>

<div class="ww-main">
  <div class="ww-layout">
    <!-- 左侧目录 -->
    <aside class="ww-toc" id="toc">
      <div class="ww-toc-title">目录</div>
      <div class="ww-toc-empty">请从顶部搜索选择文档</div>
    </aside>
    <!-- 右侧正文 -->
    <main class="ww-content" id="content">
      <div class="ww-placeholder">
        <h3>在搜索框输入关键词</h3>
        <p>搜索并选择文档即可查看完整内容</p>
      </div>
    </main>
  </div>
</div>

<div class="pp-footer">
  <div class="pp-footer-links">
    <a href="index.html">主页</a>
    <a href="nav.html">导航</a>
    <a href="prompt.html">提示词混合器</a>
    <a href="words.html">学单词</a>
  </div>
</div>

<div class="pp-toast" id="toast"></div>

<script>
var INDEX = null;
var CURRENT_DOC = null;

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

/* 简单行内格式：**bold** `code` [text](url) */
function inline(text) {
  var s = escapeHtml(text);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}

/* 渲染单个 block */
function renderBlock(block) {
  switch (block.type) {
    case 'paragraph':
      return '<div class="ww-block"><p class="ww-paragraph">' + inline(block.text || '') + '</p></div>';
    case 'image':
      var cap = block.caption ? '<figcaption>' + escapeHtml(block.caption) + '</figcaption>' : '';
      return '<figure class="ww-image"><img src="' + escapeHtml(block.src || '') + '" alt="' + escapeHtml(block.alt || '') + '">' + cap + '</figure>';
    case 'code':
      return '<div class="ww-code"><div class="ww-code-head"><span>' + escapeHtml(block.language || '') + '</span>' +
             '<button class="ww-code-copy" onclick="copyCode(this)">复制</button></div>' +
             '<pre><code>' + escapeHtml(block.code || '') + '</code></pre></div>';
    case 'list':
      var tag = block.ordered ? 'ol' : 'ul';
      var items = (block.items || []).map(function(i) { return '<li>' + inline(i) + '</li>'; }).join('');
      return '<div class="ww-list"><' + tag + '>' + items + '</' + tag + '></div>';
    case 'quote':
      var cite = block.cite ? '<cite>— ' + escapeHtml(block.cite) + '</cite>' : '';
      return '<blockquote class="ww-quote"><div class="ww-quote-text">' + inline(block.text || '') + '</div>' + cite + '</blockquote>';
    case 'table':
      var ths = (block.headers || []).map(function(h) { return '<th>' + escapeHtml(h) + '</th>'; }).join('');
      var trs = (block.rows || []).map(function(row) {
        var tds = row.map(function(c) { return '<td>' + escapeHtml(String(c)) + '</td>'; }).join('');
        return '<tr>' + tds + '</tr>';
      }).join('');
      return '<div class="ww-table"><table><thead><tr>' + ths + '</tr></thead><tbody>' + trs + '</tbody></table></div>';
    case 'divider':
      return '<hr class="ww-divider">';
    case 'note':
      var icons = { info: 'ℹ️', tip: '💡', warn: '⚠️' };
      var icon = icons[block.variant] || 'ℹ️';
      return '<div class="ww-note ' + (block.variant || 'info') + '"><span class="ww-note-icon">' + icon + '</span><div>' + inline(block.text || '') + '</div></div>';
    default:
      return '';
  }
}

/* 渲染左侧目录 */
function renderTOC(doc) {
  var toc = document.getElementById('toc');
  var html = '<div class="ww-toc-title">目录</div>';
  (doc.chapters || []).forEach(function(ch) {
    html += '<div class="ww-toc-ch"><div class="ww-toc-ch-title" data-id="' + ch.id + '">' + escapeHtml(ch.title) + '</div>';
    (ch.sections || []).forEach(function(sec) {
      html += '<div class="ww-toc-sec"><div class="ww-toc-sec-title" data-id="' + sec.id + '">' + escapeHtml(sec.title) + '</div>';
      (sec.subsections || []).forEach(function(sub) {
        html += '<div class="ww-toc-sub"><div class="ww-toc-sub-title" data-id="' + sub.id + '">' + escapeHtml(sub.title) + '</div></div>';
      });
      html += '</div>';
    });
    html += '</div>';
  });
  toc.innerHTML = html;
  // 点击滚动
  toc.querySelectorAll('[data-id]').forEach(function(el) {
    el.addEventListener('click', function() {
      var target = document.getElementById(this.dataset.id);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

/* 渲染右侧正文 */
function renderContent(doc) {
  var c = document.getElementById('content');
  var html = '';
  // 文档头
  html += '<div class="ww-doc-header">';
  html += '<div class="ww-doc-title">' + escapeHtml(doc.title || '') + '</div>';
  var meta = [];
  if (doc.author) meta.push('作者：' + escapeHtml(doc.author));
  if (doc.date) meta.push('日期：' + escapeHtml(doc.date));
  if (meta.length) html += '<div class="ww-doc-meta">' + meta.join(' · ') + '</div>';
  if (doc.summary) html += '<div class="ww-doc-summary">' + escapeHtml(doc.summary) + '</div>';
  html += '</div>';
  // 章节
  (doc.chapters || []).forEach(function(ch) {
    html += '<h2 class="ww-ch-title" id="' + ch.id + '">' + escapeHtml(ch.title) + '</h2>';
    (ch.intro || []).forEach(function(b) { html += renderBlock(b); });
    (ch.sections || []).forEach(function(sec) {
      html += '<h3 class="ww-sec-title" id="' + sec.id + '">' + escapeHtml(sec.title) + '</h3>';
      (sec.intro || []).forEach(function(b) { html += renderBlock(b); });
      (sec.subsections || []).forEach(function(sub) {
        html += '<h4 class="ww-sub-title" id="' + sub.id + '">' + escapeHtml(sub.title) + '</h4>';
        (sub.blocks || []).forEach(function(b) { html += renderBlock(b); });
      });
    });
  });
  c.innerHTML = html;
}

/* 加载文档 */
function loadDoc(file, name) {
  fetch('./assets/data/notes/' + file)
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(doc) {
      CURRENT_DOC = doc;
      renderTOC(doc);
      renderContent(doc);
      showToast('已加载：' + (name || doc.title));
    })
    .catch(function(err) {
      console.error(err);
      document.getElementById('content').innerHTML =
        '<div class="ww-placeholder"><h3>加载失败</h3><p>' + escapeHtml(err.message) + '</p></div>';
    });
}

/* 搜索索引 */
function renderSearch(query) {
  var el = document.getElementById('search-results');
  query = query.trim().toLowerCase();
  if (!query) { el.classList.remove('show'); el.innerHTML = ''; return; }
  var docs = (INDEX.documents || []).filter(function(d) {
    return (d.name || '').toLowerCase().indexOf(query) >= 0 ||
           (d.summary || '').toLowerCase().indexOf(query) >= 0;
  });
  if (!docs.length) {
    el.innerHTML = '<div class="ww-search-empty">无匹配文档</div>';
  } else {
    el.innerHTML = docs.map(function(d) {
      return '<div class="ww-search-item" data-file="' + escapeHtml(d.file) + '" data-name="' + escapeHtml(d.name) + '">' +
             '<div class="ww-search-item-name">' + escapeHtml(d.name) + '</div>' +
             '<div class="ww-search-item-summary">' + escapeHtml(d.summary || '') + '</div>' +
             '</div>';
    }).join('');
    el.querySelectorAll('.ww-search-item').forEach(function(item) {
      item.addEventListener('click', function() {
        loadDoc(this.dataset.file, this.dataset.name);
        document.getElementById('search').value = '';
        el.classList.remove('show');
      });
    });
  }
  el.classList.add('show');
}

/* 复制代码 */
function copyCode(btn) {
  var code = btn.closest('.ww-code').querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(function() {
    btn.textContent = '已复制';
    setTimeout(function() { btn.textContent = '复制'; }, 1500);
  });
}

/* 初始化 */
function init() {
  var search = document.getElementById('search');
  search.addEventListener('input', function() { renderSearch(this.value); });
  search.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      var first = document.querySelector('.ww-search-item');
      if (first) first.click();
    } else if (e.key === 'Escape') {
      this.value = ''; renderSearch('');
    }
  });
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.ww-search-wrap')) {
      document.getElementById('search-results').classList.remove('show');
    }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === '/' && e.target.tagName !== 'INPUT') {
      e.preventDefault(); search.focus();
    }
  });

  // 自动加载第一个文档
  if (INDEX.documents && INDEX.documents.length) {
    var first = INDEX.documents[0];
    loadDoc(first.file, first.name);
  }
}

// 加载索引
fetch('./assets/data/notes/notes_index.json')
  .then(function(r) { return r.json(); })
  .then(function(data) { INDEX = data; init(); })
  .catch(function(err) {
    console.error(err);
    document.querySelector('.ww-main').innerHTML =
      '<p style="text-align:center;padding:60px;color:rgba(22,23,28,0.55);">索引加载失败，请通过 HTTP 协议访问。</p>';
  });
</script>

</body>
</html>
