<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梦幻国度</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Consolas', 'Microsoft YaHei', monospace;
            user-select: none;
        }

        #gameCanvas {
            position: fixed;
            inset: 0;
            display: block;
        }

        /* ========== HUD ========== */
        #hud {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        /* 准星 */
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 18px; height: 18px;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.25s;
        }

        #crosshair.hidden { opacity: 0; }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #ffffff;
            box-shadow: 0 0 8px #88ccff, 0 0 16px #4488ff;
            border-radius: 1px;
        }

        #crosshair::before {
            top: 50%; left: 0;
            width: 100%; height: 2px;
            transform: translateY(-50%);
        }

        #crosshair::after {
            left: 50%; top: 0;
            width: 2px; height: 100%;
            transform: translateX(-50%);
        }

        #crosshair .center-dot {
            position: absolute;
            top: 50%; left: 50%;
            width: 4px; height: 4px;
            background: #88ccff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 6px #88ccff, 0 0 12px #4488ff, 0 0 20px #2266ff;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.8); }
        }

        /* 交互提示 */
        #interactHint {
            position: absolute;
            top: calc(50% + 40px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 13px;
            color: #fff;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.15s;
        }

        #interactHint.show { opacity: 1; }
        #interactHint kbd {
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
            padding: 1px 6px;
            margin-right: 4px;
            font-family: inherit;
            font-size: 12px;
        }

        /* 交互菜单 */
        #contextMenu {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 20, 0.95);
            border: 1px solid rgba(100, 150, 255, 0.4);
            border-radius: 12px;
            padding: 16px 20px;
            min-width: 200px;
            pointer-events: auto;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(100, 150, 255, 0.15);
        }

        #contextMenu.show {
            opacity: 1;
            visibility: visible;
        }

        #contextMenu .target-title {
            font-size: 14px;
            color: #88ccff;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(100, 150, 255, 0.2);
            text-align: center;
        }

        #contextMenu .menu-item {
            display: block;
            width: 100%;
            background: none;
            border: none;
            color: #ddd;
            font-family: inherit;
            font-size: 14px;
            padding: 10px 14px;
            margin: 3px 0;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s;
        }

        #contextMenu .menu-item:hover {
            background: rgba(100, 150, 255, 0.15);
            color: #fff;
        }

        #contextMenu .menu-item.danger:hover {
            background: rgba(255, 100, 100, 0.15);
            color: #ffaaaa;
        }

        #contextMenu .close-menu {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.1);
            background: none;
            border: none;
            color: #888;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        #contextMenu .close-menu:hover { color: #ccc; }

        /* 开始覆盖层（暖色调，参考 prompt.html：米色底 + 白卡片 + 黄色强调） */
        #startOverlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fff3dc 0%, #fbe3c0 45%, #faf9f4 100%);
            color: rgba(22, 23, 28, 0.88);
        }

        #startOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s, visibility 0.4s;
            pointer-events: none;
        }

        #startOverlay h1 {
            font-size: 42px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #f0a030, #e07b26);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        #startOverlay .desc {
            font-size: 14px;
            color: rgba(22, 23, 28, 0.55);
            margin-bottom: 32px;
            text-align: center;
        }

        #startOverlay .controls {
            background: #ffffff;
            border: 1px solid rgba(22, 23, 28, 0.08);
            border-radius: 16px;
            padding: 24px 32px;
            margin-bottom: 32px;
            box-shadow: 0 8px 30px rgba(180, 130, 60, 0.12);
        }

        #startOverlay .controls-row {
            display: flex;
            justify-content: space-between;
            gap: 40px;
            margin: 8px 0;
            font-size: 13px;
            color: rgba(22, 23, 28, 0.65);
        }

        #startOverlay .controls-row kbd {
            background: rgba(22, 23, 28, 0.05);
            border: 1px solid rgba(22, 23, 28, 0.12);
            border-radius: 5px;
            padding: 2px 8px;
            font-family: inherit;
            font-size: 12px;
            color: rgba(22, 23, 28, 0.88);
            min-width: 28px;
            display: inline-block;
            text-align: center;
        }

        #startBtn {
            background: #ffd83d;
            color: #3a2c10;
            border: none;
            border-radius: 12px;
            padding: 14px 48px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
            box-shadow: 0 4px 20px rgba(240, 180, 60, 0.4);
        }

        #startBtn:hover {
            transform: translateY(-2px);
            background: #ffe066;
            box-shadow: 0 8px 28px rgba(240, 180, 60, 0.55);
        }

        #startBtn:active { transform: translateY(0); }

        /* ESC 提示 */
        #escHint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            opacity: 0;
            transition: opacity 0.5s;
        }

        #escHint.show { opacity: 1; }

        /* 昼夜切换按钮 */
        #daynightBtn {
            position: fixed;
            top: 14px; right: 14px;
            background: rgba(8, 14, 28, 0.72);
            border: 1px solid rgba(120, 160, 255, 0.35);
            border-radius: 8px;
            color: #cfe6ff;
            font-family: 'Consolas', 'Microsoft YaHei', monospace;
            font-size: 13px;
            padding: 6px 14px;
            cursor: pointer;
            pointer-events: auto;
            z-index: 11;
            transition: background 0.15s, border-color 0.15s;
        }
        #daynightBtn:hover {
            background: rgba(30, 50, 90, 0.85);
            border-color: rgba(140, 190, 255, 0.6);
        }

        /* 音乐开关按钮 */
        #musicBtn {
            position: fixed;
            top: 14px; left: 14px;
            background: rgba(8, 14, 28, 0.72);
            border: 1px solid rgba(255, 200, 120, 0.35);
            border-radius: 8px;
            color: #ffd9a0;
            font-family: 'Consolas', 'Microsoft YaHei', monospace;
            font-size: 13px;
            padding: 6px 14px;
            cursor: pointer;
            pointer-events: auto;
            z-index: 11;
            transition: background 0.15s, border-color 0.15s;
        }
        #musicBtn:hover {
            background: rgba(90, 60, 20, 0.85);
            border-color: rgba(255, 210, 140, 0.6);
        }

        /* 蓄力条 */
        #chargeWrap {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.15s;
        }
        #chargeBar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #66dd66, #ffcc33, #ff4444);
            transition: width 0.05s linear;
        }

        /* 加载提示（暖色调） */
        #loading {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fff3dc 0%, #fbe3c0 45%, #faf9f4 100%);
            color: rgba(22, 23, 28, 0.55);
            font-size: 14px;
            flex-direction: column;
            gap: 16px;
        }

        #loading .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(22, 23, 28, 0.1);
            border-top-color: #f0a030;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- 背景音乐：梦幻国度 - 太极平原 -->
    <audio id="bgm" src="./assets/music/梦幻国度-太极平原.mp3" loop preload="auto"></audio>

    <!-- 图片上传 -->
    <input type="file" id="photoUpload" accept="image/*" style="display:none">

    <!-- 加载 -->
    <div id="loading">
        <div class="spinner"></div>
        <div>正在加载世界...</div>
    </div>

    <!-- 开始覆盖层 -->
    <div id="startOverlay">
        <h1>开放世界</h1>
        <p class="desc">点击下方按钮进入游戏（需要锁定鼠标）</p>
        <div class="controls">
            <div class="controls-row"><span>移动</span><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span></div>
            <div class="controls-row"><span>跳跃</span><span><kbd>Space</kbd></span></div>
            <div class="controls-row"><span>视角</span><span>鼠标</span></div>
            <div class="controls-row"><span>蓄力射箭</span><span>按住<kbd>左键</kbd>松开发射</span></div>
            <div class="controls-row"><span>交互菜单</span><span><kbd>E</kbd></span></div>
            <div class="controls-row"><span>上传照片墙</span><span><kbd>P</kbd></span></div>
            <div class="controls-row"><span>隐藏/显示准星</span><span><kbd>右键</kbd></span></div>
            <div class="controls-row"><span>解锁鼠标</span><span><kbd>Esc</kbd></span></div>
        </div>
        <button id="startBtn">▶ 开始游戏</button>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div id="crosshair">
            <div class="center-dot"></div>
        </div>
        <button id="musicBtn">🎵 音乐</button>
        <button id="daynightBtn">白天</button>
        <div id="interactHint"></div>
        <div id="escHint">按 Esc 解锁鼠标</div>
        <div id="chargeWrap">
            <div id="chargeBar"></div>
        </div>
    </div>

    <!-- 交互菜单 -->
    <div id="contextMenu">
        <div class="target-title" id="menuTitle">目标</div>
        <div id="menuItems"></div>
        <button class="close-menu" id="closeMenu">关闭 (ESC)</button>
    </div>

    <script type="module">
        import * as THREE from './assets/js/three.module.js';
        import { Sky } from './assets/js/Sky.js';
        import { Water } from './assets/js/Water.js';

        /* ============================================================
         * 游戏全局变量
         * ============================================================ */
        var canvas = document.getElementById('gameCanvas');
        var renderer, scene, camera, raycaster;
        var COLLIDABLE_MESHES = [];  // 可碰撞网格（AABB）
        var INTERACTIVE_MESHES = []; // 可交互网格（射线拾取）

        // 玩家状态
        var player = {
            position: new THREE.Vector3(0, 1.7, 0),
            velocity: new THREE.Vector3(),
            height: 1.7,
            radius: 0.35,
            speed: 5.5,
            jumpForce: 8.0,
            gravity: 22.0,
            onGround: true,  // 出生时就在地面上
        };

        // 视角（用欧拉角手动控制，避免依赖 PointerLockControls.js）
        var yaw = 0, pitch = 0;

        // 输入状态
        var keys = {};
        var isPointerLocked = false;
        var crosshairVisible = true;
        var gameStarted = false;  // 是否已进入游戏（自由模式或PointerLock模式）

        // 射线拾取
        var highlightMesh = null;
        var interactTarget = null;

        // 弓箭系统
        var bow = null;              // 第一人称弓模型
        var bowString = null;        // 弓弦（可拉伸）
        var nockedArrow = null;      // 搭在弦上的箭（视觉）
        var arrows = [];             // 飞行中/已插入的箭
        var isCharging = false;
        var chargeStart = 0;
        var maxChargeTime = 1.2;     // 蓄力到最大值的时间（秒）
        var minArrowSpeed = 12;
        var maxArrowSpeed = 55;
        var arrowGravity = 14;
        var arrowRaycaster = new THREE.Raycaster();
        var photoWall = null;        // 照片墙网格

        // 自由模式视角更新（Q/E 转向，上下方向键俯仰）
        function updateFreeLook() {
            if (!gameStarted || isPointerLocked) return;
            if (keys['KeyQ']) yaw -= 0.03;
            if (keys['KeyE']) yaw += 0.03;
            if (keys['ArrowUp']) pitch = Math.max(pitch - 0.02, -Math.PI/2 + 0.05);
            if (keys['ArrowDown']) pitch = Math.min(pitch + 0.02, Math.PI/2 - 0.05);
        }

        /* ============================================================
         * 初始化
         * ============================================================ */
        function init() {
            // 1. 渲染器
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x87b8e8, 1);
            // 阴影 + ACES 色调映射（接近 Slow Roads 的真实颜色）
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            renderer.outputColorSpace = THREE.SRGBColorSpace;

            // 2. 场景
            scene = new THREE.Scene();

            // 3. 相机（放在玩家"眼睛"位置）
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 600);
            camera.position.copy(player.position);

            // 4. 射线拾取
            raycaster = new THREE.Raycaster();
            raycaster.far = 8;

            // 5. 加载场景
            // 从 URL 参数读取场景名，默认 scene_default（放在 assets/data/scene_xxx.json）
            var sceneName = new URLSearchParams(window.location.search).get('scene') || 'default';
            var sceneUrl = './assets/data/scene_' + sceneName + '.json';
            console.log('加载场景:', sceneUrl);
            loadScene(sceneUrl).then(function(success) {
                document.getElementById('loading').style.display = 'none';
                if (!success) {
                    document.getElementById('loading').innerHTML = '<div style="color:#f66">加载场景失败，请检查控制台</div>';
                }
            });

            // 创建第一人称弓
            createBow();

            // 6. 绑定事件
            bindEvents();

            // 7. 渲染循环
            requestAnimationFrame(loop);
        }

        /* ============================================================
         * 场景加载
         * ============================================================ */
        async function loadScene(url) {
            try {
                var res = await fetch(url);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                var data = await res.json();

                // 玩家参数（出生在沙滩上）
                if (data.player) {
                    var p = data.player;
                    var spawnX = 0, spawnZ = 28;
                    var spawnH = getIslandHeight(spawnX, spawnZ);
                    player.position.set(spawnX, spawnH + p.height, spawnZ);
                    if (p.height) player.height = p.height;
                    if (p.radius) player.radius = p.radius;
                    if (p.speed) player.speed = p.speed;
                    if (p.jumpForce) player.jumpForce = p.jumpForce;
                    if (p.gravity) player.gravity = p.gravity;
                    camera.position.copy(player.position);
                }

                // 雾（白天的淡蓝色远雾，具体数值由昼夜预设控制）
                scene.fog = new THREE.Fog(0xcfe6f5, 250, 900);

                // 真实大气散射天空（Preetham 模型）
                skyObj = new Sky();
                skyObj.scale.setScalar(10000);
                scene.add(skyObj);
                // 初始太阳方向（随后被 applyDayNightPreset 覆盖）
                currentSunDir = DAYNIGHT_PRESETS[0].sunDir.clone();
                var skyUniforms = skyObj.material.uniforms;
                skyUniforms['turbidity'].value = 4;
                skyUniforms['rayleigh'].value = 1.8;
                skyUniforms['mieCoefficient'].value = 0.004;
                skyUniforms['mieDirectionalG'].value = 0.8;
                skyUniforms['cloudCoverage'].value = 0.35;
                skyUniforms['cloudDensity'].value = 0.5;
                skyUniforms['cloudElevation'].value = 0.6;
                skyUniforms['sunPosition'].value.copy(currentSunDir);

                // 环境光贴图（PMREM 让水面/物体反射真实天空，保持白天基调）
                var pmrem = new THREE.PMREMGenerator(renderer);
                var skyScene = new THREE.Scene();
                var skyForEnv = new Sky();
                skyForEnv.scale.setScalar(10000);
                var envUniforms = skyForEnv.material.uniforms;
                envUniforms['turbidity'].value = 5;
                envUniforms['rayleigh'].value = 2;
                envUniforms['mieCoefficient'].value = 0.005;
                envUniforms['mieDirectionalG'].value = 0.8;
                envUniforms['cloudCoverage'].value = 0.4;
                envUniforms['cloudDensity'].value = 0.4;
                envUniforms['cloudElevation'].value = 0.5;
                envUniforms['sunPosition'].value.copy(DAYNIGHT_PRESETS[0].sunDir);
                skyScene.add(skyForEnv);
                scene.environment = pmrem.fromScene(skyScene, 0.04).texture;
                pmrem.dispose();

                // 物体（按丘陵地表放置）
                var skipIds = ['ground', 'hill_1', 'hill_2', 'wall_s', 'wall_n', 'wall_e', 'wall_w', 'ocean', 'sea'];
                if (data.objects) {
                    data.objects.forEach(function(obj) {
                        if (skipIds.indexOf(obj.id) >= 0) return; // 跳过旧地形
                        var mesh = createMesh(obj);
                        if (mesh) {
                            var ox = mesh.position.x;
                            var oz = mesh.position.z;
                            var oh = getIslandHeight(ox, oz);
                            if (oh > 0) {
                                mesh.position.y = oh + (obj.position[1] || 0);
                            }
                            scene.add(mesh);
                        }
                    });
                }

                // 构建草原丘陵世界
                buildIsland();
                buildLakes();
                buildSun();
                buildMoon();
                addGrassTrees();
                addClouds();

                // 应用初始"白天"预设（光照/雾/曝光/天空）
                applyDayNightPreset(0);

                // 构建缓存碰撞盒（整个游戏过程不变）
                rebuildCollidableBoxes();

                return true;
            } catch (err) {
                console.error('加载场景失败:', err);
                // 失败时构建基本草原
                scene.fog = new THREE.Fog(0xcfe6f5, 250, 900);
                skyObj = new Sky();
                skyObj.scale.setScalar(10000);
                scene.add(skyObj);
                currentSunDir = DAYNIGHT_PRESETS[0].sunDir.clone();
                buildIsland();
                buildLakes();
                buildSun();
                buildMoon();
                addGrassTrees();
                addClouds();
                applyDayNightPreset(0);
                rebuildCollidableBoxes();
                return false;
            }
        }

        function setupLighting(l) {
            if (!l) return;
            if (l.ambient) {
                scene.add(new THREE.AmbientLight(new THREE.Color(l.ambient.color), l.ambient.intensity));
            }
            if (l.directional) {
                sunLight = new THREE.DirectionalLight(new THREE.Color(l.directional.color), l.directional.intensity);
                sunLight.position.set(l.directional.position[0], l.directional.position[1], l.directional.position[2]);
                scene.add(sunLight);
            }
            if (l.hemi) {
                scene.add(new THREE.HemisphereLight(
                    new THREE.Color(l.hemi.skyColor),
                    new THREE.Color(l.hemi.groundColor),
                    l.hemi.intensity
                ));
            }
        }

        /* ============================================================
         * ImprovedNoise（Perlin 噪声）— 移植自 three.js ImprovedNoise
         * ============================================================ */
        function ImprovedNoise() {
            var p = new Uint8Array(256);
            for (var i = 0; i < 256; i++) p[i] = i;
            // Fisher-Yates 洗牌
            for (var i = 255; i > 0; i--) {
                var k = Math.floor(Math.random() * (i + 1));
                var t = p[i]; p[i] = p[k]; p[k] = t;
            }
            this.perm = new Uint8Array(512);
            for (var i = 0; i < 512; i++) this.perm[i] = p[i & 255];
        }
        ImprovedNoise.prototype.noise = function(x, y, z) {
            var fade = function(t) { return t * t * t * (t * (t * 6 - 15) + 10); };
            var lerp = function(a, b, t) { return a + t * (b - a); };
            var grad = function(hash, x, y, z) {
                var h = hash & 15;
                var u = h < 8 ? x : y;
                var v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
                return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
            };
            var perm = this.perm;
            var X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
            x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
            var u = fade(x), v = fade(y), w = fade(z);
            var A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z;
            var B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;
            return lerp(
                lerp(
                    lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u),
                    lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u),
                    v
                ),
                lerp(
                    lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u),
                    lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u),
                    v
                ),
                w
            );
        };

        /* ============================================================
         * 草原丘陵地形系统（Slow Roads 风格）
         * ============================================================ */
        var LAKE_WATER_LEVEL = 0.4;   // 湖水面世界高度（与生成高度图时一致）
        var SEA_LEVEL = LAKE_WATER_LEVEL;
        var ISLAND_RADIUS = TERRAIN_HALF;   // 兼容旧边界逻辑
        var lakes = [

        var palmTrees = [];           // 保留（灾情兼容）
        var treeCollideBoxes = [];    // 树木+棕榈的透明碰撞盒
        var terrainMesh = null;
        var terrainHelper = null;  // 射线标记
        var terrainRaycaster = new THREE.Raycaster();
        var skyObj = null;
        var ambientLight = null;
        var hemiLight = null;
        var cloudSprites = [];
        var pmrem = null;
        var skyEnvScene = null;
        var skyEnvObj = null;
        var envTex = null;
        var daynightIndex = 0;
        var currentSunDir = null;

        // 地形网格分辨率
        var TERRAIN_SIZE = 220;
        var TERRAIN_SEG = 255;     // 255×255 顶点
        var TERRAIN_HALF = TERRAIN_SIZE / 2;
        var heightData = null;     // Uint8Array 高度图
        var perlin = null;
        var TERRAIN_HEIGHT_SCALE = 0.045; // heightData 值(0-255) → 世界高度的缩放

        /* 昼夜预设 */
        var DAYNIGHT_PRESETS = [
            {
                name: '白天',
                sunDir: new THREE.Vector3(0.45, 0.55, 0.4).normalize(),
                sun: { c: 0xfff4e0, i: 1.6 },
