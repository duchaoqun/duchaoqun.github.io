        /* 应用昼夜预设：更新天空、光照、雾、曝光、太阳/月亮、湖面 */
        function applyDayNightPreset(idx) {
            var P = DAYNIGHT_PRESETS[idx];
            daynightIndex = idx;
            currentSunDir = P.sunDir;

            // 天空（Preetham）
            if (skyObj && skyObj.material && skyObj.material.uniforms) {
                var u = skyObj.material.uniforms;
                u['turbidity'].value = P.sky.turb;
                u['rayleigh'].value = P.sky.ray;
                u['mieCoefficient'].value = P.sky.mie;
                u['mieDirectionalG'].value = P.sky.mieG;
                u['cloudCoverage'].value = P.sky.cloud;
                u['cloudDensity'].value = P.sky.cD;
                u['cloudElevation'].value = P.sky.cE;
                u['sunPosition'].value.copy(currentSunDir);
            }

            // 雾
            if (scene.fog) {
                scene.fog.color.setHex(P.fog.c);
                scene.fog.near = P.fog.n;
                scene.fog.far = P.fog.f;
            }

            // 光照
            if (sunLight) {
                sunLight.color.setHex(P.sun.c);
                sunLight.intensity = P.sun.i;
            }
            if (!ambientLight) {
                ambientLight = new THREE.AmbientLight(0xffffff, 1);
                scene.add(ambientLight);
            }
            ambientLight.color.setHex(P.amb.c);
            ambientLight.intensity = P.amb.i;
            if (!hemiLight) {
                hemiLight = new THREE.HemisphereLight(0xbfd8ff, 0x557a3a, 1);
                scene.add(hemiLight);
            }
            hemiLight.color.setHex(P.hemi.sky);
            hemiLight.groundColor.setHex(P.hemi.ground);
            hemiLight.intensity = P.hemi.i;

            // 太阳 / 月亮亮片
            if (sunSphere) {
                sunSphere.visible = P.sunV;
                sunSphere.position.copy(currentSunDir.clone().multiplyScalar(400));
            }
            if (moonSprite) {
                moonSprite.visible = P.moonV;
                moonSprite.position.copy(currentSunDir.clone().multiplyScalar(-400));
            }

            // 曝光 + 背景
            renderer.toneMappingExposure = P.exp;
            renderer.setClearColor(P.clearC, 1);

            // 云朵颜色
            for (var ci = 0; ci < cloudSprites.length; ci++) {
                cloudSprites[ci].material.color.setHex(P.cloudC);
                cloudSprites[ci].material.opacity = daynightIndex === 2 ? 0.5 : 0.9;
            }

            // 湖面阳光方向
            for (var li = 0; li < lakeMeshes.length; li++) {
                if (lakeMeshes[li].material.uniforms) {
                    lakeMeshes[li].material.uniforms['sunDirection'].value.copy(currentSunDir);
                    lakeMeshes[li].material.uniforms['sunColor'].value.setHex(P.exp < 1 ? 0x88aaff : 0xffffff);
                }
            }

            // 阴影相机跟随
            updateShadowCamera();

            // 按钮文案
            var btn = document.getElementById('daynightBtn');
            if (btn) btn.textContent = P.name;
        }

        function cycleDayNight() {
            applyDayNightPreset((daynightIndex + 1) % DAYNIGHT_PRESETS.length);
        }

        /* 高度图 → 世界高度（线性，无岛屿衰减） */
        function heightToWorld(h) {
            return h * TERRAIN_HEIGHT_SCALE - 0.5;
        }

        /* 判断世界坐标是否在任一个湖内（含鼓出 1.5m） */
        function inLake(x, z, pad) {
            pad = pad || 0;
            for (var i = 0; i < lakes.length; i++) {
                var dx = x - lakes[i].x, dz = z - lakes[i].z;
                if (dx * dx + dz * dz < (lakes[i].r + pad) * (lakes[i].r + pad)) return true;
            }
            return false;
        }

        /* 生成高度图：柔和丘陵 + 湖泊雕刻 + 边缘淡出 */
        function generateHeightMap() {
            perlin = new ImprovedNoise();
            var w = TERRAIN_SEG + 1;
            var d = TERRAIN_SEG + 1;
            var data = new Uint8Array(w * d);
            var zSeed = Math.random() * 100;
            var quality = 2;
            var smoothstep = function(t) { return t * t * (3 - 2 * t); };
            // 4 层 Perlin 噪声叠加（从低频到高频）——丘陵感
            for (var j = 0; j < 4; j++) {
                var jScale = (j === 0) ? 2.2 : (j === 1 ? 1.0 : 0.5);   // 低频主导，控制起伏
                for (var i = 0; i < w * d; i++) {
                    var px = i % w;
                    var py = Math.floor(i / w);
                    var n = Math.abs(perlin.noise(px / quality, py / quality, zSeed) * quality * jScale);
                    // 轻微挤压：让谷地更平、丘脊更圆（乘 0.8 + 0.4*n）
                    n = n * (0.8 + 0.4 * n);
                    data[i] += n;
                }
                quality *= 3;
            }
            // 归一化到 0-255
            var max = 0;
            for (var i = 0; i < data.length; i++) if (data[i] > max) max = data[i];
            if (max > 0) {
                for (var i = 0; i < data.length; i++) data[i] = data[i] / max * 255;
            }
            // 挖湖：把湖所在区域的每个像素压到接近湖水位
            for (var li = 0; li < lakes.length; li++) {
                var L = lakes[li];
                for (var y = 0; y < d; y++) {
                    for (var x = 0; x < w; x++) {
                        var wx = (x / w - 0.5) * TERRAIN_SIZE;
                        var wz = (y / d - 0.5) * TERRAIN_SIZE;
                        var ddx = wx - L.x, ddz = wz - L.z;
                        var dist = Math.sqrt(ddx * ddx + ddz * ddz) / L.r;
                        if (dist >= 1.0) continue;
                        // 目标海域高度像素值（湖水位下方一点，露出水面）
                        var target = (LAKE_WATER_LEVEL - 0.35 + 0.5) / TERRAIN_HEIGHT_SCALE;
                        var tt = smoothstep(Math.max(0, 1 - dist));  // 中心 tt=1，边缘 tt=0
                        data[y * w + x] = Math.min(data[y * w + x], target + (1 - tt) * 50);
                    }
                }
            }
            // 边缘最外 6% 向基线平滑过渡，防越界坠入空洞
            var edgePix = Math.max(4, Math.floor(w * 0.06));
            var baseH = (0.25 + 0.5) / TERRAIN_HEIGHT_SCALE;
            for (var e = 1; e <= edgePix; e++) {
                var bw = smoothstep(e / edgePix);   // 越靠内(大e)越接近原值，靠边→接近 baseH
                var alpha = 1 - smoothstep((edgePix - e) / edgePix);
                for (var yy = 0; yy < d; yy++) {
                    var iL = yy * w + e;
                    var iR = yy * w + (w - 1 - e);
                    data[iL] = data[iL] + (baseH - data[iL]) * alpha;
                    data[iR] = data[iR] + (baseH - data[iR]) * alpha;
                }
                for (var xx = 0; xx < w; xx++) {
                    var iiT = e * w + xx;
                    var iiB = (d - 1 - e) * w + xx;
                    data[iiT] = data[iiT] + (baseH - data[iiT]) * alpha;
                    data[iiB] = data[iiB] + (baseH - data[iiB]) * alpha;
                }
            }
            return data;
        }

        /* 生成草地色带地形纹理（不再烘焙阳光，光影交给实时光照 + 阴影） */
        function generateTerrainTexture(data, w, d) {
            var canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = d;
            var ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, d);
            var image = ctx.getImageData(0, 0, w, d);
            var imageData = image.data;

            // 湖水面在高度图 0-255 中的像素值
            var waterH = (LAKE_WATER_LEVEL + 0.5) / TERRAIN_HEIGHT_SCALE;

            // 草地色带（暖绿丘陵风格，参照 Slow Roads）
            var bands = [
                { h: 0.16, c: [122, 168, 99]  },  // 湖岸/浅滩湿草
                { h: 0.34, c: [96, 148, 78]   },  // 低洼草地
                { h: 0.55, c: [112, 155, 84]  },  // 主要草地
                { h: 0.74, c: [132, 158, 92]  },  // 高处干草
                { h: 1.01, c: [150, 144, 108] },  // 岩土
            ];
            function colorAt(h) {
                if (h <= bands[0].h) return bands[0].c;
                for (var b = 1; b < bands.length; b++) {
                    if (h <= bands[b].h) {
                        var a = bands[b - 1], n = bands[b];
                        var t = (h - a.h) / Math.max(1e-6, (n.h - a.h));
                        return [
                            a.c[0] + (n.c[0] - a.c[0]) * t,
                            a.c[1] + (n.c[1] - a.c[1]) * t,
                            a.c[2] + (n.c[2] - a.c[2]) * t,
                        ];
                    }
                }
                return bands[bands.length - 1].c;
            }

            for (var i = 0, j = 0; i < imageData.length; i += 4, j++) {
                var h = data[j] / 255;
                var r, g, b;
                if (data[j] <= waterH) {
                    // 湖床：浅沙 + 蓝绿水草
                    var depth = 1 - Math.max(0, (waterH - data[j]) / waterH);
                    r = 70 + 30 * depth; g = 108 + 24 * depth; b = 90 + 30 * depth;
                } else {
                    var cb = colorAt(h);
                    r = cb[0]; g = cb[1]; b = cb[2];
                }
                // 细微随机噪声，打破色带硬边
                var nz = (Math.random() * 16 - 8);
                imageData[i]     = Math.max(0, Math.min(255, r + nz));
                imageData[i + 1] = Math.max(0, Math.min(255, g + nz));
                imageData[i + 2] = Math.max(0, Math.min(255, b + nz));
                imageData[i + 3] = 255;
            }
            ctx.putImageData(image, 0, 0);

            // 放大 4x 并加细节噪声
            var canvasScaled = document.createElement('canvas');
            canvasScaled.width = w * 4; canvasScaled.height = d * 4;
            var ctx2 = canvasScaled.getContext('2d');
            ctx2.scale(4, 4);
            ctx2.drawImage(canvas, 0, 0);
            var image2 = ctx2.getImageData(0, 0, canvasScaled.width, canvasScaled.height);
            var imageData2 = image2.data;
            for (var i = 0; i < imageData2.length; i += 4) {
                var v = Math.floor(Math.random() * 5);
                imageData2[i] += v;
                imageData2[i + 1] += v;
                imageData2[i + 2] += v;
            }
            ctx2.putImageData(image2, 0, 0);
            return canvasScaled;
        }

        /* 从高度图采样世界高度（用于碰撞和物体放置） */
        function getIslandHeight(x, z) {
            if (!heightData) return 0;
            var w = TERRAIN_SEG + 1;
            var d = TERRAIN_SEG + 1;
            // 世界坐标 → 高度图像素坐标
            var fx = (x / TERRAIN_SIZE + 0.5) * w;
            var fz = (z / TERRAIN_SIZE + 0.5) * d;
            // 双线性插值采样
            var ix = Math.floor(fx), iz = Math.floor(fz);
            if (ix < 0 || ix >= w - 1 || iz < 0 || iz >= d - 1) {
                // 越界钳制到湖水位基线（地形边缘已向该值平滑过渡），防止坠入空洞
                return 0;
            }
            var tx = Math.min(Math.max(fx - ix, 0), 1);
            var tz = Math.min(Math.max(fz - iz, 0), 1);
            var h00 = heightData[iz * w + ix];
            var h10 = heightData[iz * w + (ix + 1)];
            var h01 = heightData[(iz + 1) * w + ix];
            var h11 = heightData[(iz + 1) * w + (ix + 1)];
            var h0 = h00 + (h10 - h00) * tx;
            var h1 = h01 + (h11 - h01) * tx;
            var h = h0 + (h1 - h0) * tz;
            // 高度图值(0-255) → 世界高度
            var worldH = h * TERRAIN_HEIGHT_SCALE - 0.5;
            // 整体钳制：最低不过湖水位基线上方一点，最高不超过地形上限
            return Math.max(0, Math.min(worldH, TERRAIN_HEIGHT_SCALE * 255 - 0.5));
        }

        /* 构建海岛地形 */
        function buildIsland() {
            var w = TERRAIN_SEG + 1;
            var d = TERRAIN_SEG + 1;

            // 1. 生成高度图
            heightData = generateHeightMap();

            // 2. 创建几何体
            var geo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEG, TERRAIN_SEG);
            geo.rotateX(-Math.PI / 2);

            // 3. 用高度图设置顶点 Y
            var pos = geo.attributes.position;
            for (var i = 0, j = 0; i < pos.count; i++, j += 3) {
                // 高度图索引对应顶点
                pos.array[j + 1] = heightData[i] * TERRAIN_HEIGHT_SCALE - 0.5;
            }
            geo.computeVertexNormals();

            // 4. 生成烘焙光照纹理
            var tex = new THREE.CanvasTexture(generateTerrainTexture(heightData, w, d));
            tex.wrapS = THREE.ClampToEdgeWrapping;
            tex.wrapT = THREE.ClampToEdgeWrapping;
            tex.colorSpace = THREE.SRGBColorSpace;

            // 5. 创建网格
            var mat = new THREE.MeshStandardMaterial({
                map: tex,
                roughness: 0.95,
                metalness: 0.0,
            });
            mat.receiveShadow = true;
            mat.castShadow = true;
            var mesh = new THREE.Mesh(geo, mat);
            scene.add(mesh);
            terrainMesh = mesh;

            // 射线标记已移除（示例辅助工具，游戏不需要）
        }

        /* ============================================================
         * 湖泊（three.js Water — 每个湖一个圆形水面，真实反射天空）
         * ============================================================ */
        function buildLakes() {
            var waterNormalsTex = new THREE.TextureLoader().load('./assets/textures/waternormals.jpg');
            waterNormalsTex.wrapS = waterNormalsTex.wrapT = THREE.RepeatWrapping;
            var sunDir = currentSunDir || new THREE.Vector3(0.5, 0.6, 0.4).normalize();

            lakeMeshes.forEach(function(m) { if (m) { m.geometry.dispose(); scene.remove(m); } });
            lakeMeshes = [];

            lakes.forEach(function(L) {
                var geo = new THREE.CircleGeometry(L.r * 1.05, 48);
                geo.rotateX(-Math.PI / 2);
                var water = new Water(geo, {
                    textureWidth: 256,
                    textureHeight: 256,
                    waterNormals: waterNormalsTex,
                    sunDirection: sunDir,
                    sunColor: 0xffffff,
                    waterColor: 0x2d6b8a,
                    distortionScale: 3.2,
                    fog: scene.fog !== undefined,
                });
                water.rotation.z = 0;
                water.position.set(L.x, LAKE_WATER_LEVEL, L.z);
                water.userData.lake = L;
                scene.add(water);
                lakeMeshes.push(water);
            });
        }

        /* ============================================================
         * 太阳（亮片 + 定向光投影）
         * ============================================================ */
        function buildSun() {
            var sunDir = currentSunDir || new THREE.Vector3(0.5, 0.6, 0.4).normalize();
            // 太阳：用 Canvas 生成带核心+光晕的纹理，做成 Sprite（加法混合，无深度问题）
            var c = document.createElement('canvas');
            c.width = 256; c.height = 256;
            var ctx = c.getContext('2d');
            var g1 = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
            g1.addColorStop(0, 'rgba(255,250,230,0.95)');
            g1.addColorStop(0.1, 'rgba(255,245,200,0.6)');
            g1.addColorStop(0.3, 'rgba(255,235,170,0.25)');
            g1.addColorStop(1, 'rgba(255,220,140,0)');
            ctx.fillStyle = g1;
            ctx.fillRect(0, 0, 256, 256);
            var g2 = ctx.createRadialGradient(128, 128, 0, 128, 128, 30);
            g2.addColorStop(0, 'rgba(255,255,255,1)');
            g2.addColorStop(0.6, 'rgba(255,250,230,0.9)');
            g2.addColorStop(1, 'rgba(255,240,200,0)');
            ctx.fillStyle = g2;
            ctx.fillRect(0, 0, 256, 256);

            var sunTex = new THREE.CanvasTexture(c);
            var sunMat = new THREE.SpriteMaterial({
                map: sunTex,
                transparent: true,
                depthWrite: false,
                fog: false,
                blending: THREE.AdditiveBlending,
            });
            sunSphere = new THREE.Sprite(sunMat);
            sunSphere.scale.set(60, 60, 1);
            sunSphere.position.copy(sunDir.clone().multiplyScalar(400));
            scene.add(sunSphere);

            // 定向光 + 阴影
            if (!sunLight) {
                sunLight = new THREE.DirectionalLight(0xfff4e0, 1.5);
                sunLight.castShadow = true;
                sunLight.shadow.mapSize.set(2048, 2048);
                sunLight.shadow.bias = -0.0005;
                var cam = sunLight.shadow.camera;
                cam.near = 1; cam.far = 220;
                cam.left = -80; cam.right = 80; cam.top = 80; cam.bottom = -80;
                scene.add(sunLight);
            }
            sunLight.position.copy(sunDir.clone().multiplyScalar(120));
            sunLight.target.position.set(0, 0, 0);
            updateShadowCamera();
        }

        /* ============================================================
         * 月亮（夜晚亮片）
         * ============================================================ */
        function buildMoon() {
            var dir = (-currentSunDir || new THREE.Vector3(-0.4, 0.6, -0.3)).clone().normalize();
            var c = document.createElement('canvas');
            c.width = 192; c.height = 192;
            var ctx = c.getContext('2d');
            var g = ctx.createRadialGradient(96, 96, 0, 96, 96, 96);
            g.addColorStop(0, 'rgba(235,240,255,1)');
            g.addColorStop(0.25, 'rgba(220,228,252,0.55)');
            g.addColorStop(0.7, 'rgba(200,215,245,0.12)');
            g.addColorStop(1, 'rgba(190,210,240,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 192, 192);
            // 简单月面暗斑
            ctx.beginPath(); ctx.arc(88, 92, 22, 0, 7); ctx.fillStyle = 'rgba(170,180,200,0.5)'; ctx.fill();
            ctx.beginPath(); ctx.arc(114, 116, 14, 0, 7); ctx.fillStyle = 'rgba(170,180,200,0.4)'; ctx.fill();

            var moonMat = new THREE.SpriteMaterial({
                map: new THREE.CanvasTexture(c),
                transparent: true,
                depthWrite: false,
                fog: false,
                blending: THREE.AdditiveBlending,
            });
            moonSprite = new THREE.Sprite(moonMat);
            moonSprite.scale.set(42, 42, 1);
            moonSprite.position.copy(dir.multiplyScalar(400));
            moonSprite.visible = false;
            scene.add(moonSprite);
        }

        // 让阴影相机跟随玩家，保证角色/树影清晰
        function updateShadowCamera() {
            if (!sunLight) return;
            var p = player ? player.position : new THREE.Vector3(0, 0, 0);
            var target = p.clone();
            var lightPos = target.clone().add(currentSunDir.clone().multiplyScalar(120));
            sunLight.position.copy(lightPos);
            sunLight.target.position.copy(target);
            sunLight.target.updateMatrixWorld();
        }

        /* ============================================================
         * 草原树木 + 灌木（Slow Roads 风格低多边形植被）
         * ============================================================ */
        function addGrassTrees() {
            // 树木（避开湖中央，且不种在湖水里）
            for (var i = 0; i < 40; i++) {
                var x = (Math.random() - 0.5) * (TERRAIN_SIZE - 24);
                var z = (Math.random() - 0.5) * (TERRAIN_SIZE - 24);
                var h = getIslandHeight(x, z);
                if (h <= 0.6) continue;            // 太低（湖/岸）不种
                if (inLake(x, z)) continue;        // 湖内不种
                createGrassTree(x, h, z);
            }
            // 灌木（数量更多、更低矮）
            for (var i = 0; i < 90; i++) {
                var x = (Math.random() - 0.5) * TERRAIN_SIZE;
                var z = (Math.random() - 0.5) * TERRAIN_SIZE;
                var h = getIslandHeight(x, z);
                if (h <= 0.3) continue;
                if (inLake(x, z)) continue;
                createBush(x, h, z);
            }
        }

        function createGrassTree(x, y, z) {
            var group = new THREE.Group();
            var s = 0.8 + Math.random() * 0.5;
            var trunkMat = new THREE.MeshStandardMaterial({ color: 0x6f5234, roughness: 0.95 });
            var trunkH = (2.2 + Math.random() * 1.4) * s;
            var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14 * s, 0.2 * s, trunkH, 7), trunkMat);
            trunk.position.y = trunkH / 2;
            trunk.castShadow = true;
            group.add(trunk);

            // 树冠：2-3 层球形/锥体，触手可及的低多边形
            var leafColors = [0x3f8f3f, 0x4f9f4f, 0x37913b, 0x55a050];
            var leafMat = new THREE.MeshStandardMaterial({
                color: leafColors[Math.floor(Math.random() * leafColors.length)],
                roughness: 0.85,
            });
            var topY = trunkH;
            var curR = (1.05 + Math.random() * 0.3) * s;
            var layers = 2 + Math.floor(Math.random() * 2);
            for (var l = 0; l < layers; l++) {
                var sphere = new THREE.Mesh(new THREE.SphereGeometry(curR, 8, 6), leafMat);
                sphere.position.y = topY + curR * 0.5;
                sphere.castShadow = true;
                group.add(sphere);
                topY = sphere.position.y;
                curR *= 0.75;
            }
            group.position.set(x, y, z);
            group.rotation.y = Math.random() * Math.PI * 2;
            scene.add(group);

            // 树干碰撞盒（可射线命中 + 阻挡）
            var collideH = trunkH + 0.6;
            var trunkBox = new THREE.Mesh(
                new THREE.BoxGeometry(0.6, collideH, 0.6),
                new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
            );
            trunkBox.position.set(x, y + collideH / 2, z);
            trunkBox.userData = { id: 'tree_' + palmTrees.length, name: '大树', collidable: true, interactive: true, actions: ['查看', '砍伐'] };
            scene.add(trunkBox);
            COLLIDABLE_MESHES.push(trunkBox);
            INTERACTIVE_MESHES.push(trunkBox);
            palmTrees.push(group);
        }

        function createBush(x, y, z) {
            var group = new THREE.Group();
            var s = 0.6 + Math.random() * 0.5;
            var bushMat = new THREE.MeshStandardMaterial({ color: 0x3f8f3f, roughness: 0.9 });
            var n = 3 + Math.floor(Math.random() * 3);
            for (var i = 0; i < n; i++) {
                var sph = new THREE.Mesh(new THREE.SphereGeometry(s * (0.5 + Math.random() * 0.4), 6, 4), bushMat);
                sph.position.set(
                    (Math.random() - 0.5) * s * 1.2,
                    s * 0.3,
                    (Math.random() - 0.5) * s * 1.2
                );
                sph.castShadow = true;
                group.add(sph);
            }
            group.position.set(x, y, z);
            group.rotation.y = Math.random() * Math.PI * 2;
            scene.add(group);

            var box = new THREE.Mesh(
                new THREE.BoxGeometry(s * 1.4, s * 0.7, s * 1.4),
                new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
            );
            box.position.set(x, y + s * 0.35, z);
            box.userData = { id: 'bush_' + palmTrees.length, name: '灌木', collidable: true, interactive: true, actions: ['查看', '砍伐'] };
            scene.add(box);
            COLLIDABLE_MESHES.push(box);
            INTERACTIVE_MESHES.push(box);
        }

        function createMesh(obj) {
            var geo, mesh;
            var matProps = {
                color: new THREE.Color(obj.color || '#888888'),
                roughness: 0.85,
                metalness: 0.0,
            };
            if (obj.emissive) {
                matProps.emissive = new THREE.Color(obj.emissive);
                matProps.emissiveIntensity = 0.6;
            }
            var material = new THREE.MeshStandardMaterial(matProps);

            switch (obj.type) {
                case 'box':
                    geo = new THREE.BoxGeometry(obj.size[0], obj.size[1], obj.size[2]);
                    mesh = new THREE.Mesh(geo, material);
                    break;
                case 'sphere':
                    geo = new THREE.SphereGeometry(obj.radius, 16, 12);
                    mesh = new THREE.Mesh(geo, material);
                    break;
                case 'cylinder':
                    geo = new THREE.CylinderGeometry(
                        obj.radiusTop || 0.5,
                        obj.radiusBottom || 0.5,
                        obj.height || 1,
                        12
                    );
                    mesh = new THREE.Mesh(geo, material);
                    break;
                case 'cone':
                    geo = new THREE.ConeGeometry(obj.radius || 0.5, obj.height || 1, 12);
                    mesh = new THREE.Mesh(geo, material);
                    break;
                case 'group':
                    // 组合体：递归创建 children，放进一个 Group
                    mesh = new THREE.Group();
                    if (obj.children) {
                        obj.children.forEach(function(child) {
                            var childMesh = createMesh(child);
                            if (childMesh) mesh.add(childMesh);
                        });
                    }
                    break;
                default:
                    console.warn('未知类型:', obj.type);
                    return null;
            }

            mesh.position.set(obj.position[0], obj.position[1], obj.position[2]);
            mesh.userData = {
                id: obj.id,
                name: obj.name || obj.id || obj.type,
                collidable: obj.collidable !== false,
                interactive: obj.interactive === true,
                actions: obj.actions || [],
            };

            // Group 没有自己的 geometry，碰撞和交互交给子 mesh 处理
            if (mesh.isGroup) {
                if (mesh.userData.interactive) {
                    mesh.children.forEach(function(c) { INTERACTIVE_MESHES.push(c); });
                }
            } else {
                if (mesh.userData.collidable) COLLIDABLE_MESHES.push(mesh);
                if (mesh.userData.interactive) INTERACTIVE_MESHES.push(mesh);
            }

            return mesh;
        }

        function addClouds() {
            // 生成柔和的云纹理（多层叠加，更有体积感）
            var c = document.createElement('canvas');
            c.width = 128; c.height = 128;
            var ctx = c.getContext('2d');
            for (var blob = 0; blob < 5; blob++) {
                var bx = 40 + Math.random() * 48;
                var by = 40 + Math.random() * 48;
                var br = 14 + Math.random() * 12;
                var g = ctx.createRadialGradient(bx, by, 0, bx, by, br);
                g.addColorStop(0, 'rgba(255,255,255,0.9)');
                g.addColorStop(0.5, 'rgba(255,255,255,0.45)');
                g.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, 128, 128);
            }
            var cloudTex = new THREE.CanvasTexture(c);
            cloudTex.colorSpace = THREE.SRGBColorSpace;

            var cloudMat = new THREE.SpriteMaterial({
                map: cloudTex,
                transparent: true,
                opacity: 0.9,
                depthWrite: false,
                color: 0xffffff,
            });

            cloudSprites = [];
            var count = 60;
            for (var i = 0; i < count; i++) {
                var sprite = new THREE.Sprite(cloudMat.clone());
                var angle = Math.random() * Math.PI * 2;
                var dist = 60 + Math.random() * 180;
                sprite.position.set(
                    Math.cos(angle) * dist,
                    25 + Math.random() * 60,
                    Math.sin(angle) * dist
                );
                var scale = 18 + Math.random() * 30;
                sprite.scale.set(scale * (0.8 + Math.random() * 0.6), scale * (0.5 + Math.random() * 0.4), 1);
                sprite.userData.drift = 0.2 + Math.random() * 0.6;
                sprite.userData.baseAngle = angle;
                sprite.userData.dist = dist;
                scene.add(sprite);
                cloudSprites.push(sprite);
            }
        }

        function updateClouds(dt) {
            scene.children.forEach(function(obj) {
                if (obj.isSprite && obj.userData.drift) {
                    obj.userData.baseAngle += obj.userData.drift * dt * 0.02;
                    var a = obj.userData.baseAngle;
                    var d = obj.userData.dist;
                    obj.position.x = Math.cos(a) * d;
                    obj.position.z = Math.sin(a) * d;
                }
            });
        }

        /* ============================================================
         * 弓（第一人称视角模型）
         * ============================================================ */
        function createBow() {
            var group = new THREE.Group();

            // 弓身：半圆环
            var bowRadius = 0.32;
            var bowGeo = new THREE.TorusGeometry(bowRadius, 0.018, 8, 24, Math.PI);
            // 默认端点在 ±X、弧凸向 +Y。旋转几何：端点 → ±Y，凸向 → -Z（前方）
            bowGeo.rotateZ(Math.PI / 2);
            bowGeo.rotateY(-Math.PI / 2);
            var bowMat = new THREE.MeshStandardMaterial({ color: 0x6b3a1a, roughness: 0.7, metalness: 0.1 });
            var bowBody = new THREE.Mesh(bowGeo, bowMat);
            group.add(bowBody);

            // 弓弦：细圆柱沿 Y 轴连接两端点 (0, ±bowRadius, 0)
            var stringMat = new THREE.MeshBasicMaterial({ color: 0xeeeeee });
            var stringGeo = new THREE.CylinderGeometry(0.004, 0.004, bowRadius * 2, 6);
            bowString = new THREE.Mesh(stringGeo, stringMat);
            bowString.position.set(0, 0, 0);
            // 默认弓弦在 z=0，蓄力时向 +Z（后方/射手方向）拉
            group.add(bowString);

            // 搭箭（视觉）：箭头尖端朝相机前方（-Z），故绕 Y 旋转 180°
            nockedArrow = createArrowMesh();
            nockedArrow.visible = true;
            nockedArrow.position.set(0, 0, 0);
            nockedArrow.rotation.y = Math.PI;
            group.add(nockedArrow);

            // 整体放到相机右下角
            group.position.set(0.3, -0.28, -0.55);
            group.rotation.y = -0.1;
            camera.add(group);
            scene.add(camera); // 确保相机在场景图中
            bow = group;
        }

        /* ============================================================
         * 箭矢
         * ============================================================ */
        // 箭的"前方"统一为局部 +Z（箭头尖端）
        var ARROW_FORWARD = new THREE.Vector3(0, 0, 1);

        function createArrowMesh() {
            var g = new THREE.Group();

            // 箭杆（沿 Z 轴）
            var shaft = new THREE.Mesh(
                new THREE.CylinderGeometry(0.012, 0.012, 0.7, 8),
                new THREE.MeshStandardMaterial({ color: 0xc9a35a, roughness: 0.8 })
            );
            shaft.rotation.x = Math.PI / 2; // Y 轴圆柱转成沿 Z
            g.add(shaft);

            // 箭头（尖端朝 +Z）
            var tip = new THREE.Mesh(
                new THREE.ConeGeometry(0.03, 0.12, 10),
                new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.8, roughness: 0.3 })
            );
            tip.rotation.x = Math.PI / 2; // 尖端朝 +Z
            tip.position.z = 0.41;
            g.add(tip);

            // 箭羽（两片交叉，在尾部 -Z）
            var fletchMat = new THREE.MeshStandardMaterial({ color: 0xcc3333, side: THREE.DoubleSide, roughness: 0.7 });
            var f1 = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.13, 0.07), fletchMat);
            f1.position.z = -0.3;
            g.add(f1);
            var f2 = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.02, 0.07), fletchMat);
            f2.position.z = -0.3;
            g.add(f2);

            return g;
        }

        function shootArrow(charge) {
            var arrow = createArrowMesh();
            arrow.userData = { velocity: new THREE.Vector3(), stuck: false, life: 0 };

            // 从相机位置沿视角方向发射
            var dir = new THREE.Vector3();
            camera.getWorldDirection(dir);

            // 起始位置：相机前方一点，避免卡在身上
            var start = camera.position.clone().add(dir.clone().multiplyScalar(0.6));
            arrow.position.copy(start);
            // 让箭的局部 +Z（箭头）对齐飞行方向
            arrow.quaternion.setFromUnitVectors(ARROW_FORWARD, dir);

            var speed = minArrowSpeed + (maxArrowSpeed - minArrowSpeed) * charge;
            arrow.userData.velocity.copy(dir).multiplyScalar(speed);

            scene.add(arrow);
            arrows.push(arrow);
        }

        function updateArrows(dt) {
            for (var i = arrows.length - 1; i >= 0; i--) {
                var a = arrows[i];
                if (a.userData.stuck) continue;

                a.userData.life += dt;
                var vel = a.userData.velocity;
                // 重力
                vel.y -= arrowGravity * dt;

                var moveLen = vel.length() * dt;
                if (moveLen < 1e-6) continue;
                var dir = vel.clone().normalize();

                // 扫掠碰撞：从当前位置向 dir 发射 moveLen 距离
                arrowRaycaster.set(a.position, dir);
                arrowRaycaster.far = moveLen;
                var arrowTargets = COLLIDABLE_MESHES.slice();
                if (terrainMesh) arrowTargets.push(terrainMesh);
                var hits = arrowRaycaster.intersectObjects(arrowTargets, false);

                if (hits.length > 0) {
                    var hit = hits[0];
                    // 插入：让箭尖（局部 +Z 约 0.47）嵌入命中点
                    a.position.copy(hit.point).add(dir.clone().multiplyScalar(-0.4));
                    a.quaternion.setFromUnitVectors(ARROW_FORWARD, dir);
                    a.userData.stuck = true;
                    a.userData.velocity.set(0, 0, 0);
                } else {
                    a.position.add(dir.clone().multiplyScalar(moveLen));
                    a.quaternion.setFromUnitVectors(ARROW_FORWARD, dir);
                }

                // 超时移除（飞出世界）
                if (a.userData.life > 8 || a.position.y < -40) {
                    scene.remove(a);
                    arrows.splice(i, 1);
                }
            }
        }

        /* ============================================================
         * 蓄力 & 弓弦动画
         * ============================================================ */
        function getCharge() {
            if (!isCharging) return 0;
            var t = (performance.now() - chargeStart) / 1000;
            return Math.min(t / maxChargeTime, 1);
        }

        function updateBow(now) {
            if (!bow) return;
            var c = getCharge();
            // 弓弦向后拉（+Z 方向，相对弓的局部）
            if (bowString) {
                bowString.position.z = c * 0.12;
            }
            // 搭箭随之后移
            if (nockedArrow) {
                nockedArrow.position.z = c * 0.12;
            }
            // 蓄力时弓略微变色提示
            bow.children[0].material.emissive = new THREE.Color(0x442200).multiplyScalar(c);

            // 蓄力进度条
            var bar = document.getElementById('chargeBar');
            if (bar) {
                bar.style.width = (c * 100) + '%';
                bar.parentElement.style.opacity = isCharging ? '1' : '0';
            }
        }

        /* ============================================================
         * 照片墙（上传图片）
         * ============================================================ */
        function createPhotoWall(texture) {
            if (photoWall) {
                // 替换已有照片墙的纹理
                photoWall.material[4].map = texture;
                photoWall.material[4].needsUpdate = true;
                return;
            }
            var w = 5, h = 3.2, d = 0.15;
            var geo = new THREE.BoxGeometry(w, h, d);
            // 6 个面：[右,左,上,下,前,后]
            var wood = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.85 });
            var front = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.7 });
            var materials = [wood, wood, wood, wood, front, wood];
            photoWall = new THREE.Mesh(geo, materials);
            // 放在玩家前方（-Z 方向），面朝玩家（+Z 面为前）
            var pwZ = -12;
            var pwH = getIslandHeight(0, pwZ);
            photoWall.position.set(0, Math.max(pwH, 0) + h / 2, pwZ);
            photoWall.userData = {
                id: 'photoWall',
                name: '照片墙',
                collidable: true,
                interactive: true,
                actions: ['查看', '更换照片', '破坏'],
            };
            scene.add(photoWall);
            COLLIDABLE_MESHES.push(photoWall);
            INTERACTIVE_MESHES.push(photoWall);
            rebuildCollidableBoxes();
        }

        /* ============================================================
         * 事件绑定
         * ============================================================ */
        function bindEvents() {
            // ===== 背景音乐（梦幻国度 - 太极平原，循环播放）=====
            var bgm = document.getElementById('bgm');
            var musicBtn = document.getElementById('musicBtn');
            bgm.volume = 0.5;
            function playBgm() {
                var p = bgm.play();
                if (p && p.catch) p.catch(function(err) { console.log('背景音乐播放失败:', err); });
                musicBtn.textContent = '🎵 音乐';
            }
            function toggleBgm() {
                if (bgm.paused) {
                    playBgm();
                } else {
                    bgm.pause();
                    musicBtn.textContent = '🔇 静音';
                }
            }
            musicBtn.addEventListener('click', toggleBgm);

            // 开始按钮 → Pointer Lock
            document.getElementById('startBtn').addEventListener('click', function() {
                canvas.requestPointerLock();
                playBgm();
            });

            // 昼夜切换按钮
            document.getElementById('daynightBtn').addEventListener('click', cycleDayNight);

            document.addEventListener('pointerlockchange', function() {
                isPointerLocked = document.pointerLockElement === canvas;
                gameStarted = isPointerLocked;
                document.getElementById('startOverlay').classList.toggle('hidden', isPointerLocked);
                document.getElementById('escHint').classList.toggle('show', isPointerLocked);
                if (!isPointerLocked) closeContextMenu();
            });

            // 键盘
            document.addEventListener('keydown', function(e) {
                keys[e.code] = true;
                if (e.code === 'Escape') closeContextMenu();
                // 在开始覆盖层按 V 进入自由模式（无需 PointerLock）
                if (!gameStarted && document.getElementById('startOverlay').classList.contains('hidden') === false) {
                    if (e.code === 'KeyV') {
                        document.getElementById('startOverlay').classList.add('hidden');
                        gameStarted = true;
                        playBgm();
                    }
                }
                // E 键：交互（打开交互菜单）
                if (e.code === 'KeyE' && gameStarted && isPointerLocked) {
                    var menu = document.getElementById('contextMenu');
                    if (menu.classList.contains('show')) {
                        closeContextMenu();
                    } else {
                        handleLeftClick();
                    }
                }
                // P 键：上传图片作为照片墙
                if (e.code === 'KeyP') {
                    document.getElementById('photoUpload').click();
                }
            });
            document.addEventListener('keyup', function(e) { keys[e.code] = false; });

            // 鼠标视角（Pointer Lock 模式）
            document.addEventListener('mousemove', function(e) {
                if (!isPointerLocked) return;
                yaw -= e.movementX * 0.0022;
                pitch -= e.movementY * 0.0022;
                var lim = Math.PI / 2 - 0.01;
                if (pitch > lim) pitch = lim;
                if (pitch < -lim) pitch = -lim;
            });

            // 鼠标按钮
            canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });
            canvas.addEventListener('mousedown', function(e) {
                // 右键始终切换准星（即使未锁定也允许）
                if (e.button === 2) {
                    crosshairVisible = !crosshairVisible;
                    document.getElementById('crosshair').classList.toggle('hidden', !crosshairVisible);
                    return;
                }
                if (!isPointerLocked) return;
                if (e.button === 0) {
                    // 左键：蓄力射箭（若菜单打开则关闭菜单）
                    var menu = document.getElementById('contextMenu');
                    if (menu.classList.contains('show')) {
                        closeContextMenu();
                        return;
                    }
                    isCharging = true;
                    chargeStart = performance.now();
                }
            });
            canvas.addEventListener('mouseup', function(e) {
                if (e.button !== 0) return;
                if (!isCharging) return;
                var c = getCharge();
                isCharging = false;
                // 极短按也射出最低速箭
                shootArrow(Math.max(c, 0.05));
            });

            // 窗口缩放
            window.addEventListener('resize', function() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        /* ============================================================
         * 左键拾取 + 交互菜单
         * ============================================================ */
        function getLookTarget() {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            var hits = raycaster.intersectObjects(INTERACTIVE_MESHES, false);
            return hits.length > 0 ? hits[0].object : null;
        }

        function handleLeftClick() {
            // 如果菜单已打开，关闭
            var menu = document.getElementById('contextMenu');
            if (menu.classList.contains('show')) {
                closeContextMenu();
                return;
            }

            var target = getLookTarget();
            if (target) openContextMenu(target);
        }

        function openContextMenu(mesh) {
            var ud = mesh.userData;
            document.getElementById('menuTitle').textContent = ud.name + (ud.id ? ' (' + ud.id + ')' : '');

            var itemsDiv = document.getElementById('menuItems');
            itemsDiv.innerHTML = '';

            if (ud.actions && ud.actions.length > 0) {
                ud.actions.forEach(function(action) {
                    var btn = document.createElement('button');
                    btn.className = 'menu-item';
                    if (action === '破坏' || action === '关闭') btn.classList.add('danger');
                    btn.textContent = action;
                    btn.addEventListener('click', function() {
                        console.log('[' + ud.name + '] 执行动作:', action);
                        if (action === '破坏' || action === '关闭') {
                            scene.remove(mesh);
                            var ci = COLLIDABLE_MESHES.indexOf(mesh);
                            if (ci >= 0) COLLIDABLE_MESHES.splice(ci, 1);
                            var ii = INTERACTIVE_MESHES.indexOf(mesh);
                            if (ii >= 0) INTERACTIVE_MESHES.splice(ii, 1);
                            if (mesh === photoWall) photoWall = null;
                            rebuildCollidableBoxes();
                        } else if (action === '更换照片') {
                            closeContextMenu();
                            document.getElementById('photoUpload').click();
                            return;
                        }
                        closeContextMenu();
                    });
                    itemsDiv.appendChild(btn);
                });
            } else {
                var noAction = document.createElement('div');
                noAction.style.cssText = 'color:#888;font-size:13px;text-align:center;padding:8px;';
                noAction.textContent = '没有可交互的动作';
                itemsDiv.appendChild(noAction);
            }

            // 取消 Pointer Lock 以便点击菜单
            document.exitPointerLock();
            document.getElementById('contextMenu').classList.add('show');
            isPointerLocked = false;
        }

        function closeContextMenu() {
            document.getElementById('contextMenu').classList.remove('show');
        }

        document.getElementById('closeMenu').addEventListener('click', closeContextMenu);

        /* ============================================================
         * 物理 - 简化 AABB 碰撞
         * 核心思路：先算候选新位置，再检测每个轴是否碰撞，贴到面上
         * ============================================================ */

        // 缓存网格的世界 AABB（避免每帧 applyMatrix4）
        var COLLIDABLE_BOXES = [];

        function rebuildCollidableBoxes() {
            // 强制让 three.js 更新所有 mesh 的 matrixWorld（因为 mesh 创建后未 render 过）
            scene.updateMatrixWorld(true);
            COLLIDABLE_BOXES = [];
            for (var i = 0; i < COLLIDABLE_MESHES.length; i++) {
                var m = COLLIDABLE_MESHES[i];
                if (!m.geometry.boundingBox) m.geometry.computeBoundingBox();
                var b = m.geometry.boundingBox.clone();
                b.applyMatrix4(m.matrixWorld);
                COLLIDABLE_BOXES.push(b);
            }
            // 调试输出
            console.log('碰撞盒重建完成，共 ' + COLLIDABLE_BOXES.length + ' 个');
        }

        function aabbIntersect(a, b) {
            return a.min.x <= b.max.x && a.max.x >= b.min.x &&
                   a.min.y <= b.max.y && a.max.y >= b.min.y &&
                   a.min.z <= b.max.z && a.max.z >= b.min.z;
        }

        // 玩家 AABB（脚在 pos.y - player.height，头在 pos.y，中心在 pos.x, pos.z）
        function playerBox(pos) {
            return {
                minX: pos.x - player.radius, maxX: pos.x + player.radius,
                minY: pos.y - player.height, maxY: pos.y,
                minZ: pos.z - player.radius, maxZ: pos.z + player.radius,
            };
        }

        function boxIntersectPlayer(mBox, pBox) {
            return pBox.minX <= mBox.max.x && pBox.maxX >= mBox.min.x &&
                   pBox.minY <= mBox.max.y && pBox.maxY >= mBox.min.y &&
                   pBox.minZ <= mBox.max.z && pBox.maxZ >= mBox.min.z;
        }

        /* ============================================================
         * 更新逻辑 - 完全重写，保证方向+物理正确
         * ============================================================ */
        function update(dt) {
            if (!gameStarted) return;

            // --- 视角 ---
            camera.rotation.order = 'YXZ';
            camera.rotation.set(pitch, yaw, 0);

            // --- 方向向量（严格匹配 three.js 相机 rotation.set(pitch, yaw, 0)）---
            // three.js 相机默认朝 -Z。绕 Y 轴旋转 yaw 时，forward 用绕 Y 旋转矩阵：
            //   cos(yaw)*0 + sin(yaw)*(-1) = -sin(yaw)
            // 所以 forward = (-sin(yaw), 0, -cos(yaw))
            var sinY = Math.sin(yaw), cosY = Math.cos(yaw);
            var forwardX = -sinY, forwardZ = -cosY;
            // right = forward × up = (cos(yaw), 0, -sin(yaw))
            var rightX = cosY, rightZ = -sinY;

            // --- 输入 → 移动方向 ---
            var mx = 0, mz = 0;
            if (keys['KeyW'] || keys['ArrowUp'])    { mx += forwardX; mz += forwardZ; }
            if (keys['KeyS'] || keys['ArrowDown'])  { mx -= forwardX; mz -= forwardZ; }
            if (keys['KeyD'] || keys['ArrowRight']) { mx += rightX;   mz += rightZ; }
            if (keys['KeyA'] || keys['ArrowLeft'])  { mx -= rightX;   mz -= rightZ; }

            var len = Math.sqrt(mx * mx + mz * mz);
            if (len > 1e-6) { mx /= len; mz /= len; }

            // --- 速度 ---
            var desiredVX = mx * player.speed;
            var desiredVZ = mz * player.speed;

            // 重力 / 跳跃
            if (player.onGround) {
                // 在地面上：清除上一帧残留的垂直速度
                player.velocity.y = 0;
                if (keys['Space']) {
                    player.velocity.y = player.jumpForce;
                    player.onGround = false;
                }
            } else {
                // 在空中：持续施加重力
                player.velocity.y -= player.gravity * dt;
            }

            // --- 碰撞解算 ---
            var nx = player.position.x + desiredVX * dt;
            var nz = player.position.z + desiredVZ * dt;
            var ny = player.position.y + player.velocity.y * dt;

            // === 先做"站地探测"：用当前位置（未移动）检查脚下是否有地面 ===
            player.onGround = false;
            var FOOT_OFFSET = 0.05;  // 脚离地容差
            var currentFootY = player.position.y - player.height;
            for (var f = 0; f < COLLIDABLE_BOXES.length; f++) {
                var fb = COLLIDABLE_BOXES[f];
                // 检查玩家水平范围是否覆盖这个碰撞盒
                if (player.position.x + player.radius >= fb.min.x && player.position.x - player.radius <= fb.max.x &&
                    player.position.z + player.radius >= fb.min.z && player.position.z - player.radius <= fb.max.z) {
                    // 脚下方很近有地面顶面
                    if (currentFootY >= fb.max.y - FOOT_OFFSET && currentFootY <= fb.max.y + FOOT_OFFSET) {
                        player.onGround = true;
                        break;
                    }
                }
            }

            // X 轴
            var pBoxX = playerBox(new THREE.Vector3(nx, player.position.y, player.position.z));
            var footY = player.position.y - player.height;
            for (var i = 0; i < COLLIDABLE_BOXES.length; i++) {
                var mb = COLLIDABLE_BOXES[i];
                // 跳过地板：如果这个盒子的顶面就在玩家脚附近，它是地板，不应阻挡水平移动
                var isFloor = (mb.max.y <= footY + 0.1 && mb.max.y >= footY - 0.2);
                if (isFloor) continue;
                if (boxIntersectPlayer(mb, pBoxX)) {
                    if (desiredVX > 0) {
                        nx = mb.min.x - player.radius - 0.001;
                    } else if (desiredVX < 0) {
                        nx = mb.max.x + player.radius + 0.001;
                    }
                    desiredVX = 0;
                    break;
                }
            }

            // Z 轴
            var pBoxZ = playerBox(new THREE.Vector3(nx, player.position.y, nz));
            for (var j = 0; j < COLLIDABLE_BOXES.length; j++) {
                var mb2 = COLLIDABLE_BOXES[j];
                var isFloor2 = (mb2.max.y <= footY + 0.1 && mb2.max.y >= footY - 0.2);
                if (isFloor2) continue;
                if (boxIntersectPlayer(mb2, pBoxZ)) {
                    if (desiredVZ > 0) {
                        nz = mb2.min.z - player.radius - 0.001;
                    } else if (desiredVZ < 0) {
                        nz = mb2.max.z + player.radius + 0.001;
                    }
                    desiredVZ = 0;
                    break;
                }
            }

            // Y 轴（跳/落）- 只处理"方向合理"的盒子
            // 下落 → 只处理玩家**下方**的盒子（地面）
            // 上升 → 只处理玩家**上方**的盒子（天花板）
            var pBoxY = playerBox(new THREE.Vector3(nx, ny, nz));
            player.onGround = false;
            var feetTargetY = ny - player.height;
            var headTargetY = ny;
            for (var k = 0; k < COLLIDABLE_BOXES.length; k++) {
                var mb3 = COLLIDABLE_BOXES[k];
                if (!boxIntersectPlayer(mb3, pBoxY)) continue;

                if (player.velocity.y <= 0) {
                    // 下落：盒子必须在脚下附近（顶面在脚下方 0.5m 内）
                    if (mb3.max.y > feetTargetY + 0.5) continue; // 太高了，不是地面
                    ny = mb3.max.y + player.height + 0.001;
                    player.velocity.y = 0;
                    player.onGround = true;
                    break;
                } else {
                    // 上升：盒子必须在头顶附近（底面在头上 0.5m 内）
                    if (mb3.min.y < headTargetY - 0.5) continue; // 太低了，不是天花板
                    ny = mb3.min.y - 0.001;
                    player.velocity.y = 0;
                    break;
                }
            }

            // 边界保护：掉出世界就重置
            if (ny < -30) {
                nx = 0; nz = 28;
                ny = getIslandHeight(nx, nz) + player.height;
                player.velocity.set(0, 0, 0);
            }

            // 地形高度碰撞（高度场采样）
            var terrainH = getIslandHeight(nx, nz);
            var footY = ny - player.height;
            if (footY < terrainH) {
                // 脚在地面以下 → 站到地面上
                ny = terrainH + player.height;
                if (player.velocity.y < 0) {
                    player.velocity.y = 0;
                }
                player.onGround = true;
            }

            // 最终写入
            player.position.set(nx, ny, nz);
            player.velocity.x = desiredVX;
            player.velocity.z = desiredVZ;

            // 相机跟随
            camera.position.copy(player.position);

            // 射线拾取高亮
            updateHighlight();
        }

        function updateHighlight() {
            var target = crosshairVisible ? getLookTarget() : null;

            if (highlightMesh && highlightMesh !== target) {
                highlightMesh.material.emissive.setHex(0x000000);
                highlightMesh.material.emissiveIntensity = 0;
                highlightMesh = null;
            }

            if (target && target !== highlightMesh) {
                highlightMesh = target;
                target.material.emissive.setHex(0x4466aa);
                target.material.emissiveIntensity = 0.5;
            }

            // 交互提示
            var hint = document.getElementById('interactHint');
            if (target) {
                hint.innerHTML = '<kbd>E</kbd> ' + target.userData.name;
                hint.classList.add('show');
            } else {
                hint.classList.remove('show');
            }
        }

        /* ============================================================
         * 渲染循环
         * ============================================================ */
        var lastTime = performance.now();
        function loop(now) {
            var dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            update(dt);
            updateArrows(dt);
            updateBow(now);
            updateClouds(dt);
            // 天空云朵动画
            if (skyObj) {
                skyObj.material.uniforms['time'].value = now * 0.001;
            }
            // 湖面动画（Water 波动）+ 阴影相机跟随
            for (var wi = 0; wi < lakeMeshes.length; wi++) {
                if (lakeMeshes[wi].material.uniforms) {
                    lakeMeshes[wi].material.uniforms['time'].value += dt;
                }
            }
            updateShadowCamera();
            renderer.render(scene, camera);

            requestAnimationFrame(loop);
        }

        // 照片墙：上传图片
        document.getElementById('photoUpload').addEventListener('change', function(e) {
            var file = e.target.files && e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(ev) {
                var img = new Image();
                img.onload = function() {
                    var tex = new THREE.Texture(img);
                    tex.colorSpace = THREE.SRGBColorSpace;
                    tex.needsUpdate = true;
                    createPhotoWall(tex);
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
            // 允许重复选择同一文件
            e.target.value = '';
        });

        // 启动
        try {
            init();
        } catch (err) {
            console.error('游戏初始化失败:', err);
            document.getElementById('loading').innerHTML =
                '<div style="color:#f66">初始化失败: ' + err.message + '</div>';
        }
    </script>
</body>
</html>
